<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E2673C">
<title>Milo — Milo grows with you</title>
<meta name="description" content="Milo. A soft friend who breathes with kids aged 6–12, then dares them to one small brave move. A 3Shamrocks Studio staging prototype. Private and on-device.">
<meta name="robots" content="noindex, nofollow">

<!-- CSP: no eval, on-device only. Inline style/script are used because this is a single-file PWA;
     a production build would move to nonce-based CSP. Nothing connects off-device except Google Fonts. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; object-src 'none'">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Palette = the canonical 3Shamrocks Design System brand: [data-brand="milo"]
   — warm cream world, soft sage signature, peach-coral brand hero, warm cocoa
   ink, pillowy 22px. Variable NAMES are kept stable; only the brand VALUES
   change. Safety rule held: NO alarming reds anywhere — warmth/crisis = amber. */
:root{
  /* Richer, warmer world — tuned to the creature's apricot/terracotta/honey
     palette. Deeper, more saturated and more alive than the previous pastels,
     while holding the safety rule: NO alarming reds anywhere (the hero is a
     warm terracotta, and crisis/warmth stays amber). */
  --bg1:#FBEEE0; --bg2:#F3E1CE;                                   /* warm oat cream */
  --card:#FFF9F1; --card-2:#F9EDDF;
  --green:#6FA96F; --green-deep:#48844B; --green-soft:#DFEBD6;    /* moss sage: companion, growth, safe */
  --blue:#6FAF9E; --blue-deep:#417F70; --blue-soft:#D8EBE3;       /* deep sage-teal: calm / breathing */
  --amber:#E9A23B; --amber-deep:#C07A1E; --amber-soft:#FBE5C2;    /* honey: warmth / nourish / crisis */
  --coral:#E2673C; --coral-deep:#B94A22; --coral-soft:#FFD8C4;    /* terracotta hero (not an alarm red) */
  --ink:#3A281F; --ink-soft:#6B5343; --ink-faint:#A08974;         /* deep warm cocoa */
  --line:#EBD8C4;
  --radius:22px; --radius-sm:15px;
  --shadow:0 10px 30px rgba(92,46,26,.13);
  --shadow-sm:0 4px 14px rgba(92,46,26,.10);
  --darkgrey:#2C302F;
}
body{
  font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,.brand .name,.section,.ob h1,.bhero .bt,.feel .lbl,.sheet h3{
  font-family:'Quicksand',system-ui,-apple-system,sans-serif;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

/* ---- shell ---- */
.app{max-width:460px;margin:0 auto;min-height:100vh;position:relative;
  display:flex;flex-direction:column;padding:0 16px 96px;}
@media(min-width:480px){
  .app{margin:18px auto;min-height:calc(100vh - 36px);border-radius:30px;
    background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.2));
    box-shadow:0 24px 60px rgba(50,80,70,.14);overflow:hidden;padding:0 18px 96px;}
}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:16px 2px 8px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--bg1),rgba(233,243,238,0));backdrop-filter:blur(2px)}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{width:30px;height:30px;flex:0 0 auto}
.brand .name{font-weight:700;font-size:1.18rem;letter-spacing:.3px;color:var(--coral-deep)}
.brand .tline{font-size:.66rem;color:var(--ink-faint);font-weight:600;margin-top:-2px}
.protochip{font-size:.6rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--amber-deep);background:var(--amber-soft);padding:4px 9px;border-radius:99px;border:1px solid #EFD9B7}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-sm);margin:12px 0}
.card.soft{background:var(--card-2)}
h2.section{font-size:1.06rem;font-weight:700;margin:6px 2px 2px;color:var(--ink)}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint);font-size:.82rem}

/* ---- pet stage ---- */
.petstage{display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:14px 14px 6px;position:relative}
.petwrap{width:200px;height:200px;animation:breathe 5.5s ease-in-out infinite}
.petwrap svg{width:100%;height:100%;overflow:visible}
@keyframes breathe{0%,100%{transform:scale(.985) translateY(2px)}50%{transform:scale(1.025) translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.petwrap{animation:none}}
.bubble{max-width:300px;background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:12px 15px;box-shadow:var(--shadow-sm);font-weight:500;color:var(--ink);
  position:relative;margin-top:6px;animation:rise .5s ease both}
.bubble:after{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:16px;height:16px;background:#fff;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.bubble .who{font-size:.72rem;color:var(--green-deep);font-weight:700;display:block;margin-bottom:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- feeling picker ---- */
.feelrow{display:flex;gap:8px;justify-content:space-between;margin-top:10px;flex-wrap:wrap}
.feel{flex:1 1 0;min-width:62px;background:var(--card-2);border:1.5px solid var(--line);
  border-radius:16px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .15s ease,border-color .15s ease,background .15s ease}
.feel:hover{transform:translateY(-2px)}
.feel:active{transform:scale(.96)}
.feel.sel{border-color:var(--green);background:var(--green-soft)}
.feel .face{font-size:1.7rem;line-height:1}
.feel .lbl{font-size:.7rem;font-weight:600;color:var(--ink-soft)}
.skiprow{margin-top:10px;text-align:center}
.linkbtn{color:var(--green-deep);font-weight:600;font-size:.85rem;text-decoration:underline;text-underline-offset:3px;background:none}

/* ---- actions grid ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.action{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;
  text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);
  transition:transform .15s ease,box-shadow .15s ease}
.action:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.action:active{transform:scale(.97)}
.action .ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.ic-green{background:var(--green-soft)}.ic-blue{background:var(--blue-soft)}.ic-amber{background:var(--amber-soft)}
.action .t{font-weight:700;font-size:.95rem}
.action .d{font-size:.76rem;color:var(--ink-soft);line-height:1.35}

/* ---- quest ---- */
.quest{background:linear-gradient(150deg,#FBF4E7,#FDF9F0);border:1px solid #F0E3CC}
.quest .qkicker{font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--amber-deep)}
.quest .qtext{font-weight:600;font-size:1.05rem;margin:6px 0 2px}
.btnrow{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}
.btn{border-radius:14px;padding:11px 16px;font-weight:700;font-size:.92rem;
  transition:transform .12s ease,filter .15s ease;flex:1 1 auto;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-deep)}
.btn.amber{background:var(--amber);color:#5a3d12;box-shadow:0 4px 0 var(--amber-deep)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn.ghost{background:var(--card-2);color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none}
.btn.block{width:100%;flex:none}

/* ---- journey ---- */
.arc{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;margin:6px 0 2px}
.arcnode{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.4;
  transition:opacity .4s ease,transform .4s ease}
.arcnode.reached{opacity:1}
.arcnode.current{transform:translateY(-4px)}
.arcnode .mini{width:100%;max-width:54px;aspect-ratio:1/1}
/* the creature artwork */
.petart{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-select:none;
  filter:drop-shadow(0 8px 14px rgba(92,46,26,.16))}
/* a gentle Tamagotchi touch-reaction: tap the creature and it wiggles happily */
.worldstage .petwrap{cursor:pointer}
.petwrap.reacting{animation:petwiggle .72s ease-in-out}
@keyframes petwiggle{0%,100%{transform:rotate(0) scale(1)}14%{transform:rotate(-5deg) scale(1.05)}
  38%{transform:rotate(4deg) scale(1.06)}62%{transform:rotate(-3deg) scale(1.04)}84%{transform:rotate(2deg) scale(1.02)}}
.petheart{position:absolute;left:50%;top:22%;font-size:1.5rem;pointer-events:none;z-index:6;
  animation:heartfloat 1.15s ease-out forwards}
@keyframes heartfloat{0%{opacity:0;transform:translate(-50%,0) scale(.5)}18%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-78px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.petwrap.reacting{animation:none}.petheart{animation:none;opacity:0}}
.arcnode .mlock{font-size:.55rem;font-weight:700;color:var(--amber-deep);text-transform:uppercase;letter-spacing:.3px;margin-top:-4px}
.planlist{margin:6px 0 0;padding-left:18px;font-size:.86rem;color:var(--ink-soft)}
.planlist li{margin:3px 0}
.soonbtn{opacity:.6;cursor:not-allowed}
.arcnode .mlabel{font-size:.62rem;font-weight:700;color:var(--ink-soft);text-align:center}
.arcnode.current .mlabel{color:var(--green-deep)}
.vine{height:12px;border-radius:99px;background:var(--green-soft);overflow:hidden;margin-top:6px}
.vine>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--amber));
  transition:width 1s cubic-bezier(.2,.9,.3,1)}
.reflectlist{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.reflect{display:flex;align-items:center;gap:11px;background:var(--card-2);border:1px solid var(--line);
  border-radius:14px;padding:11px 13px}
.reflect .n{font-weight:700;font-size:1.15rem;color:var(--green-deep);min-width:26px;text-align:center}
.reflect .x{font-size:.85rem;color:var(--ink-soft)}
.moodtrack{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mdot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.04)}

/* ---- learned chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{background:var(--green-soft);color:var(--green-deep);border-radius:99px;padding:6px 12px;
  font-size:.8rem;font-weight:600}

/* ---- about ---- */
.note{border-radius:15px;padding:13px 14px;font-size:.86rem;line-height:1.5;margin:10px 0}
.note .nt{font-weight:700;display:block;margin-bottom:3px}
.note.calm{background:var(--blue-soft);border:1px solid #CFE0EC;color:#2C4655}
.note.warm{background:var(--amber-soft);border:1px solid #EFDCBC;color:#6A4B22}
.note.green{background:var(--green-soft);border:1px solid #CDE7DB;color:#2F5648}
.helpcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:9px}
.helpcard .hn{font-weight:700}
.helpcard .hd{font-size:.83rem;color:var(--ink-soft)}
.needsverify{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:#8a5a00;background:#FBEAC6;border:1px solid #E8D199;border-radius:99px;padding:2px 8px;margin-left:6px}

/* ---- studio footer ---- */
.studio{margin:18px 0 6px;text-align:center}
.logochip{display:inline-flex;align-items:center;justify-content:center;background:var(--darkgrey);
  border-radius:14px;padding:11px 16px;box-shadow:var(--shadow-sm)}
.logochip img{height:26px;display:block}
.studio .tm{font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-top:9px}
.studio .cp{font-size:.7rem;color:var(--ink-faint);margin-top:3px}

/* ---- tab bar ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;
  pointer-events:none}
.tabbar .inner{pointer-events:auto;display:flex;gap:4px;background:rgba(255,255,255,.86);
  backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:6px;
  margin-bottom:14px;box-shadow:var(--shadow);width:min(420px,calc(100% - 32px));justify-content:space-around}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:16px;
  color:var(--ink-faint);font-size:.68rem;font-weight:700;transition:color .15s,background .15s}
.tab .ti{font-size:1.15rem;line-height:1}
.tab.on{color:var(--green-deep);background:var(--green-soft)}

/* ---- overlay (gentle modals) ---- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(40,60,52,.42);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .25s ease both}
@media(min-width:480px){.overlay{align-items:center}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:min(460px,100%);max-height:92vh;overflow:auto;
  border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(40,60,52,.2);animation:slideup .35s cubic-bezier(.2,.9,.3,1) both}
@media(min-width:480px){.sheet{border-radius:26px}}
@keyframes slideup{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:2px 0 4px;font-size:1.18rem}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}

/* ---- breathing (co-regulation: the pet breathes WITH the child) ---- */
.breathscene{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:6px 0 4px}
.breathwrap{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center;margin:2px auto}
.breathorb{position:absolute;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#CFEAF6,#9FC8DE);box-shadow:0 0 0 16px rgba(159,200,222,.16),0 0 0 34px rgba(159,200,222,.09);
  transform:scale(.55);transition:transform 4s ease-in-out;will-change:transform}
.breathpet{position:relative;z-index:1;width:150px;height:150px;animation:none !important;
  transform:scale(.78);transition:transform 4s ease-in-out;will-change:transform}
.breathpet svg{width:100%;height:100%;overflow:visible}
.breathlabel{font-size:1.25rem;font-weight:700;color:var(--blue-deep);min-height:1.5em}
.breathcount{font-size:.82rem;color:var(--ink-faint);font-weight:600}
.breathopts{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:2px}
.buzztoggle{display:inline-flex;align-items:center;gap:7px;background:var(--card-2);border:1.5px solid var(--line);
  border-radius:99px;padding:6px 13px;font-size:.78rem;font-weight:600;color:var(--ink-soft)}
.buzztoggle.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-deep)}
.buzztoggle .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}
.buzztoggle.on .dot{background:var(--blue-deep)}
@media (prefers-reduced-motion:reduce){.breathorb,.breathpet{transition-duration:.4s !important}}

/* ---- breathe hero (the lead feature) ---- */
.bhero{background:linear-gradient(150deg,#E6F3FB,#EAF6F1);border:1px solid #CFE6F1;
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin:12px 0;
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  transition:transform .15s ease,box-shadow .15s ease}
.bhero:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bhero:active{transform:scale(.99)}
.bhero .bico{width:62px;height:62px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;background:radial-gradient(circle at 50% 40%,#CFEAF6,#9FC8DE);
  box-shadow:0 0 0 8px rgba(159,200,222,.16);animation:herobreathe 5.5s ease-in-out infinite}
@keyframes herobreathe{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.bhero .bico{animation:none}}
.bhero .bt{font-weight:700;font-size:1.05rem;color:var(--blue-deep)}
.bhero .bk{font-size:.64rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--blue);margin-bottom:1px}
.bhero .bd{font-size:.82rem;color:var(--ink-soft);line-height:1.4;margin-top:2px}

/* onboarding */
.ob{padding-top:8px;animation:rise .4s ease both}
.ob h1{font-size:1.7rem;margin:6px 0 2px;color:var(--green-deep)}
.ob .lead{font-size:1rem;color:var(--ink-soft)}
.input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1rem;
  font-family:inherit;color:var(--ink);background:#fff;margin-top:8px}
.input:focus{outline:none;border-color:var(--green)}
.suggrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.sugg{background:var(--card-2);border:1.5px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:600;font-size:.85rem;color:var(--ink-soft)}
.sugg:active{transform:scale(.96)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green);width:18px;border-radius:99px}

/* celebrate */
.celebrate{text-align:center}
.celebrate .spark{font-size:2.2rem}

.milocap{text-align:center;font-size:.82rem;color:var(--ink-soft);margin-top:10px}

/* ---- restored home loop ---- */
.worldstage.home{min-height:246px;padding:10px 14px 12px}
.worldstage.home .petwrap{width:118px;height:118px}
.card.checkin .feelrow{flex-wrap:nowrap;gap:6px}
.card.checkin .feel{min-width:0;padding:10px 2px 8px}
.card.checkin .feel .face{font-size:1.55rem}
.card.checkin .feel .lbl{font-size:.64rem;line-height:1.15;text-align:center}
.bhero.lead{padding:20px 16px;border-width:1.5px;box-shadow:var(--shadow)}
.bhero.lead .bico{width:72px;height:72px;font-size:2.2rem}
.bhero.lead .bt{font-size:1.18rem}
.card.checkin{padding:16px 14px}
.card.skill .qkicker,.card.soft .qkicker{font-size:.68rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--amber-deep)}
.skillrow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;margin-top:8px;background:var(--card-2);
  border:1px solid var(--line);border-radius:16px;padding:12px 13px}
.skillrow .ico{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.35rem}
.skillrow .t{font-weight:700;font-size:.98rem}
.skillrow .d{font-size:.8rem;color:var(--ink-soft);line-height:1.35}

/* ---- helper moments (occasional, ~1 in 4 opens) ---- */
.bhero.help{background:linear-gradient(150deg,#FFE9E0,#FBEFEA);border-color:#F6C9B8}
.bhero .bk.help{color:var(--coral-deep)}
.bico.hc{background:radial-gradient(circle at 50% 40%,#FFD8C8,#F2A88D);box-shadow:0 0 0 8px rgba(239,100,64,.14)}
.bubble.need{border:1.5px solid #F6C9B8;animation:needpulse 2.8s ease-in-out infinite}
@keyframes needpulse{0%,100%{box-shadow:var(--shadow-sm)}50%{box-shadow:0 8px 24px rgba(239,100,64,.22)}}
.feelpick{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:8px}
.fchip{background:var(--card-2);border:1.5px solid var(--line);border-radius:99px;padding:11px 18px;
  font-weight:700;font-size:.95rem;color:var(--ink);text-transform:capitalize;transition:transform .12s ease,border-color .15s,background .15s}
.fchip:hover{border-color:var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
.fchip:active{transform:scale(.94)}
.helpgrid{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.helpchoice{display:flex;align-items:center;gap:13px;background:#fff;border:1.5px solid var(--line);
  border-radius:16px;padding:13px 15px;text-align:left;box-shadow:var(--shadow-sm);
  transition:transform .12s ease,border-color .15s}
.helpchoice:hover{border-color:var(--coral);transform:translateY(-2px)}

function blankState(){

    growth:0, stage:1, hapticsOn:true,
    counts:{checkins:0, breaths:0, feelings:0, quests:0, nourish:0, rests:0, visitDays:0, helps:0},

  try{ var raw = localStorage.getItem(KEY); if(raw){ var o = JSON.parse(raw); if(o && o.v===1){ var b=blankState(); for(var k in b) if(!(k in o)) o[k]=b[k]; for(var c in b.counts) if(!(c in o.counts)) o.counts[c]=b.counts[c]; scrubLegacy(o); return o; } } }catch(e){}

/* ---- local-only metrics (no network, no ids, just counters) ---- */
var _openFlags = {breathe:false, practice:false};

  if(kind==='breathe' && !_openFlags.breathe){ _openFlags.breathe = true; metric('opensBreathe'); }

function pct(n,d){ return d ? Math.round(100*n/d)+'%' : '—'; }

function today(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

}

/* growth + evolution (no streaks, no decay, no pressure) */
/* FREE vs PARENT PLAN. Free forever: breathe, check-in, grown-up help,
   stages 1–2, a starter set of brave moves. Parent plan (COMING SOON — no
   payment integration exists): the full brave-move library, grown-up tips,
   stages 3–5. Growth points keep counting on the free plan and are never
   lost, so the bond never decreases. Safety is never paywalled. */
var PLAN = { parent:false, freeMaxStage:2, freeQuests:3 };
function stageCap(){ return PLAN.parent ? 5 : Math.max(PLAN.freeMaxStage, S.stage); }
function atFreeCap(){ return !PLAN.parent && S.stage >= PLAN.freeMaxStage && S.stage < 5; }

function simple(){ return S.ageBand === '6-8'; }

  'I’m really glad you’re here.',

var MOODS = [

/* Today's brave move — a small real-life quest. "I did it" and "maybe

  {kick:'Look around', t:'Notice 3 things you can see, 2 you can hear, 1 you can feel.', done:'You came back to right now. That’s a real skill.'},

/* ============================================================

var MILO_MOMENTS = [

    E('div',{class:'hc-ico',text:emoji}),
    E('div',{},[E('div',{class:'hc-t',text:title}), E('div',{class:'hc-d',text:desc})])

  openSheet(function(close){
    var list = E('div',{class:'linelist'});
    COMFORTS.forEach(function(c){ list.appendChild(E('button',{class:'lineopt',on:{click:function(){ helpResolve(m,'comfort'); }}}, '“'+c+'”')); });

/* A gentle Tamagotchi touch-reaction — tap the creature, it wiggles happily
   and a little heart drifts up. Pure affection, on purpose: no points, no
   growth, no pressure (growth only ever comes from real care actions). */
var _petReactLock = false;
function petReact(petw){
  if(_petReactLock || !petw) return;
  _petReactLock = true;
  buzz(14);
  petw.classList.remove('reacting'); void petw.offsetWidth;   // restart the animation
  petw.classList.add('reacting');
  // a pat makes Milo beam, then settle back to how it was feeling
  var img = petw.querySelector('.petart');
  if(img){
    var was = img.getAttribute('src');
    var happy = petArtFile(S.stage, 'great').src;
    if(happy !== was){ img.src = happy; img.dataset.revert = was; }
  }
  var heart = E('div',{class:'petheart',text: rnd(['💛','✨','🫶','💛','🐾'])});
  petw.appendChild(heart);
  setTimeout(function(){ if(heart.parentNode) heart.parentNode.removeChild(heart); }, 1200);
  setTimeout(function(){
    petw.classList.remove('reacting'); _petReactLock = false;
    if(img && img.dataset.revert){ img.src = img.dataset.revert; delete img.dataset.revert; }
  }, 900);
}

/* ---------------- TODAY — the restored loop (5 Nov 2026) ----------------
   1. How are you?  (optional; "I'd rather not say"; the heaviest choice
      opens grown-up help in one tap)
   2. Breathe together — the hero (in 4 · hold 2 · out 6, optional haptics)
   3. One small care skill — or, about 1 in 4 opens, a helper moment
      (Milo has butterflies, any help works, always hands back to the child)
   4. Today's brave move — "I did it" / "maybe later", zero shame
   5. Grow together — 5 stages, no streaks, no decay, bond never decreases
   ----------------------------------------------------------------------- */
// One roll per app open, never per re-render: helper moments stay occasional.
var HELPER_THIS_OPEN = Math.random() < 0.25;

  {ic:'ic-green', emoji:'🏷️', t:'Name the feeling', d:'Find the word for what’s here. Naming it makes it smaller.', fn:function(){ openNameFeeling(); }},
  {ic:'ic-amber', emoji:'💧', t:'Take care', d:'Some water, a snack, fresh air or a stretch. Small things add up.', fn:function(){ openNourish(); }},
  {ic:'ic-blue',  emoji:'🌙', t:'Rest together', d:'Curl up and slow down. Resting is allowed.', fn:function(){ openRest(); }}
];
var careIdx = (new Date().getDate()) % CARE_SKILLS.length;

function renderToday(){
  // returning welcome (never guilt) + count a visit day
  var greetLine;
  if(S.lastVisit && S.lastVisit !== today()){
    greetLine = (S.childName? 'Hi '+S.childName+'. ' : 'Hi. ') + 'I’m so happy you came back.';
    S.counts.visitDays++;
  } else if(!S.lastVisit){
    greetLine = GREET[0];
  } else {
    greetLine = GREET[S.counts.checkins % GREET.length];
  }
  S.lastVisit = today(); save();

  var checked = S.checkinDate === today();
  var mood = checked ? S.todayMood : '';
  var breathed = S.breathDate === today();
  var heroText;
  if(!checked) heroText = greetLine + ' How are you today?';
  else if(mood === 'crisis') heroText = 'Thanks for telling me. This one’s for a grown-up — I’ll stay right here.';
  else if(breathed) heroText = 'We breathed together today. That calm is yours to keep.';
  else heroText = 'Thanks for telling me. Want to breathe with me?';

  // the world (ambience only) + Milo, mirroring the child's mood
  var world = E('div',{class:'worldstage home'});
  world.appendChild(buildWorld(S.stage, progressToNext()));
  var petw = E('div',{class:'petwrap',html:petSVG(S.stage, mood==='skip' ? '' : mood),
    role:'button','aria-label':'Give '+pet()+' a gentle pat',
    on:{click:function(){ petReact(petw); }}});
  world.appendChild(petw);
  world.appendChild(E('div',{class:'bubble'},[ E('span',{class:'who',text:pet()}), E('span',{text:heroText}) ]));
  $app.appendChild(world);

  // 1 — How are you?

  // 2 — Breathe together (the hero)
  $app.appendChild(E('button',{class:'bhero lead',on:{click:function(){ openBreathing(false); }}},[
    E('div',{class:'bico',text:'🫧'}),

      E('div',{class:'bk',text: breathed ? 'Breathe together · again any time' : 'Breathe together'}),
      E('div',{class:'bt',text: simple()? 'Slow down with '+pet() : 'Calm power, with '+pet()}),
      E('div',{class:'bd',text: simple()

        : pet()+' grows and shrinks with you — in 4, hold 2, out 6. A skill you can take anywhere.'})
    ])
  ]));

  // 3 — one small care skill (or, occasionally, a helper moment)
  if(HELPER_THIS_OPEN && !helpedToday()) $app.appendChild(helperCard());
  else $app.appendChild(careSkillCard());

var breathTimer = null;
function openBreathing(forMilo){
  var rounds = 3, current = 0;
  var rm = reduceMotion();
  // exhale shrink is gentler when reduced-motion is on
  var inScale = {orb:1, pet:1}, outScale = rm ? {orb:.82, pet:.7} : {orb:.55, pet:.78};
  openSheet(function(close){
    // the pet sits inside a soft halo; both expand and contract WITH the breath
    var orb = E('div',{class:'breathorb'});
    var petEl = E('div',{class:'breathpet',html:petSVG(S.stage,'good')});
    var stage = E('div',{class:'breathwrap'},[orb, petEl]);
    var label = E('div',{class:'breathlabel',text:'Let’s begin'});
    var count = E('div',{class:'breathcount',text:'Follow '+pet()+'.'});

    // gentle haptics opt-out (only shown where the device can actually buzz)
    var toggle = null;
    if(HAPTICS_SUPPORTED){
      toggle = E('button',{class:'buzztoggle'+(S.hapticsOn!==false?' on':''),
        'aria-pressed': String(S.hapticsOn!==false),
        on:{click:function(){
          S.hapticsOn = !(S.hapticsOn!==false); save();
          toggle.classList.toggle('on', S.hapticsOn!==false);
          toggle.setAttribute('aria-pressed', String(S.hapticsOn!==false));
          if(S.hapticsOn!==false) buzz(30); else buzzStop();
        }}},
        [E('span',{class:'dot'}), E('span',{text:'Gentle buzz'})]);
    }

    var scene = E('div',{class:'breathscene'},[
      E('div',{style:'font-size:.95rem;color:var(--ink-soft);font-weight:600',
        text: forMilo ? ('You’re helping '+pet()+' settle — breathe together')
          : (simple()?'Breathe with '+pet():'Co-regulation — '+pet()+' breathes with you')}),
      stage, label, count,
      toggle ? E('div',{class:'breathopts'},[toggle]) : null
    ]);
    var finished = false;
    var done = E('button',{class:'btn ghost block',style:'margin-top:14px',on:{click:function(){ stopBreath(); close(); if(finished && forMilo) openYourTurn(); }}},'I’m done');

    function setScale(s, dur){
      orb.style.transitionDuration = petEl.style.transitionDuration = (dur/1000)+'s';
      orb.style.transform = 'scale('+s.orb+')';
      petEl.style.transform = 'scale('+s.pet+')';
    }
    function phase(name, dur, s, then){
      label.textContent = name;
      if(s) setScale(s, dur);
      breathTimer = setTimeout(then, dur);
    }
    function cycle(){
      if(current>=rounds){ finish(); return; }
      count.textContent = 'Round '+(current+1)+' of '+rounds;
      buzz(45);                                            // a soft cue: breathe in
      phase(simple()?'Breathe in 🌸':'Breathe in…', 4000, inScale, function(){
        buzz(25);                                          // settle into the hold
        phase('Hold gently…', 2000, null, function(){
          buzz([0,90,140,90]);                             // a slow, calming pulse on the out-breath
          phase(simple()?'Let it out 🍃':'Breathe out…', 6000, outScale, function(){
            current++; cycle();
          });
        });
      });
    }
    function finish(){
      buzzStop();
      buzz([0,40,60,40]);                                  // a gentle "well done" flutter
      var fin = forMilo
        ? 'You helped me slow right down — thank you. And here’s the secret: the calm you just gave me is the very same calm you can give yourself, anywhere.'
        : 'We did that together. Feel how we’re a little calmer now? That calm is yours to keep — you can breathe like this anywhere, even without me.';
      clear(scene); scene.appendChild(E('div',{class:'petstage'},[
        E('div',{class:'petwrap',html:petSVG(S.stage,'great')}),
        E('div',{class:'bubble'},[E('span',{class:'who',text:pet()}),E('span',{text:fin})])
      ]));
      finished = true;
      done.textContent = forMilo ? ('All done — '+pet()+'’s turn to check on you 💚') : 'All done 💚';
      S.counts.breaths++; S.breathDate = today(); metric('breatheDone'); notePractice('breathe'); addGrowth(2);
      if(forMilo) markHelped();
    }
    metric('breatheStarts'); save();
    setTimeout(cycle, 500);
    return [ E('div',{class:'grab'}), scene, done ];
  }, function(){ stopBreath(); });
}
function stopBreath(){ if(breathTimer){ clearTimeout(breathTimer); breathTimer=null; } buzzStop(); }

/* ============================================================
   ON-DEVICE CRISIS SCAN — the safety backstop. Open AI chat was removed
   (5 Nov 2026) until a child-psychologist review. Any free text the child
   types (onboarding fields) is scanned locally; a match opens the
   grown-up help path. Nothing is sent anywhere.

/* --- the safety backstop: detect distress locally, every time --- */
function crisisDetect(text){
  var t = ' ' + String(text).toLowerCase().replace(/[’]/g,"'") + ' ';
  var selfharm = /(kill(ing)? (myself|me)\b|want(ing)? to die|wanna die|don'?t want to (live|be here|wake up)|end (it all|my life|things)|suicid|hurt(ing)? myself|cut(ting)? myself|harm(ing)? myself|better off dead|no reason to live|wish i (was|were) dead|nobody would miss me)/;
  var harm = /(hit me|hits me|beats me|hurts me|touch(es|ed)? me\b|scared to go home|someone hurt me|being abused|abusing me|i'?m in danger|i am in danger|not safe at home)/;
  return selfharm.test(t) || harm.test(t);
}

      E('span',{text:BRAND.name+' teaches real calm-and-coping skills, gently. Its words haven’t yet been reviewed by a child psychologist, so think of '+BRAND.name+' as a kind companion — here to support you, never to replace a grown-up or a professional.'})]),
    E('div',{class:'note green'},[E('span',{class:'nt',text:'Gently grounded in research'}),
      E('span',{text:BRAND.name+' leans on the few things that calm, non-judgmental companions seem to genuinely help with: breathing slowly together, putting words to feelings, and steady, unhurried presence. That’s why breathing comes first. '+BRAND.name+' is a place to practise calm — not a promise, and never a substitute for a real person who can help.'})])
  ]));

  $app.appendChild(E('div',{class:'card'},[
    E('h2',{class:'section',text:'A friend, not a doctor'}),
    E('div',{class:'note calm'},[
      E('span',{text:BRAND.name+' is a supportive companion — not a doctor, a counsellor, or an emergency service, and not a replacement for one. If you’re struggling, please talk to a trusted grown-up or a professional. In an emergency, contact your local emergency number right away.'})]),
    E('button',{class:'btn amber block',style:'margin-top:6px',on:{click:openCrisis}},'Talk to someone who can help')
  ]));

  $app.appendChild(grownUpCard());

  $app.appendChild(E('div',{class:'card'},[
    E('h2',{class:'section',text:'Your privacy'}),
    E('div',{class:'note green'},[
      E('span',{class:'nt',text:'Everything stays on this device'}),
      E('span',{text:'No accounts. No sign-ups. No social features. No chat with an AI. Nothing you do is sent anywhere or shared with anyone. '+BRAND.name+' never asks for your last name, address, school, or photos. Designed with children’s privacy (COPPA) in mind — we collect as little as possible, and only a first name or nickname if you choose to give one.'})]),
    E('p',{class:'faint',text:'A grown-up (or you) can erase everything below.'}),
    E('button',{class:'btn ghost block',style:'margin-top:6px',on:{click:confirmReset}},'Reset — erase everything')
  ]));

  $app.appendChild(studioFooter());
}
/* ---------------- FOR GROWN-UPS: free vs parent plan (coming soon) ---------------- */
function planBody(){
  return [
    E('div',{class:'note green'},[E('span',{class:'nt',text:'Free, forever'}),
      E('ul',{class:'planlist'},[E('li',{text:'Breathe together'}),E('li',{text:'The “How are you?” check-in'}),E('li',{text:'Grown-up help, on every screen'}),E('li',{text:'Growth stages 1–2 and a starter set of brave moves'})])]),
    E('div',{class:'note warm'},[E('span',{class:'nt',text:'Parent plan — coming soon'}),
      E('ul',{class:'planlist'},[E('li',{text:'The full brave-move library'}),E('li',{text:'Grown-up tips (never a view of your child’s feelings)'}),E('li',{text:'Growth stages 3–5'})])]),
    E('p',{class:'faint',text:'Not available yet. Nothing can be bought in this preview, and safety features are never part of a paid plan.'}),
    E('button',{class:'btn ghost block soonbtn',disabled:'disabled','aria-disabled':'true',style:'margin-top:6px'},'Coming soon')
  ];
}
function grownUpCard(){
  var m = S.metrics || blankState().metrics;
  var stats = E('div',{class:'note calm'},[E('span',{class:'nt',text:'Calm practice on this device'}),
    E('ul',{class:'planlist'},[
      E('li',{text:'Opens with a finished breathe-together: '+pct(m.opensBreathe, m.opens)+' ('+m.opensBreathe+' of '+m.opens+')'}),
      E('li',{text:'Opens with a breathe or a named feeling: '+pct(m.opensPractice, m.opens)}),
      E('li',{text:'Breathe-togethers finished once started: '+pct(m.breatheDone, m.breatheStarts)+' ('+m.breatheDone+' of '+m.breatheStarts+')'})
    ]),
    E('span',{class:'faint',style:'display:block;margin-top:6px',text:'Counted only on this device. Never sent anywhere. Reset erases it.'})]);
  return E('div',{class:'card'},[E('h2',{class:'section',text:'For grown-ups'}), stats].concat(planBody()));
}
function openParentPlan(){
  openSheet(function(close){
    return [E('div',{class:'grab'}), E('h3',{text:'For grown-ups'})].concat(planBody(),
      [E('button',{class:'linkbtn',style:'display:block;margin:12px auto 0',on:{click:close}},'Close')]);
  });
}

function confirmReset(){
  openSheet(function(close){
    return [
      E('div',{class:'grab'}),
      E('h3',{text:'Erase everything?'}),
      E('p',{class:'muted',text:'This clears your name and all your progress with '+pet()+' from this device. It can’t be undone. '+pet()+' will start over, shy and new.'}),
      E('button',{class:'btn amber block',style:'margin-top:10px',on:{click:function(){ doReset(); }}},'Yes, erase and start over'),
      E('button',{class:'btn ghost block',style:'margin-top:10px',on:{click:close}},'Keep '+pet())
    ];
  });
}
function doReset(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = blankState(); ob = {step:0,kid:'',age:'',like:''};
  closeOverlay(); route='today'; render();
}

/* ---------------- studio footer (logo on DARK-GREY chip — brand rule) ---------------- */
function studioFooter(){
  return E('div',{class:'studio'},[
    E('div',{class:'logochip'},[ E('img',{src:'3shamrocks.png',alt:'3Shamrocks Studio'}) ]),
    E('div',{class:'tm',text:BRAND.name+'™ — a 3Shamrocks Studio app'}),
    E('div',{class:'cp',text:'© 2026 3Shamrocks Studio. All rights reserved.'})
  ]);
}

/* ---------------- overlay plumbing ---------------- */
function openSheet(builder, onClose){
  closeOverlay();
  var sheet = E('div',{class:'sheet',role:'dialog','aria-modal':'true'});
  var ov = E('div',{class:'overlay',on:{click:function(e){ if(e.target===ov){ closeOverlay(); if(onClose)onClose(); } }}},[sheet]);
  var nodes = builder(function(){ closeOverlay(); if(onClose)onClose(); });
  (Array.isArray(nodes)?nodes:[nodes]).forEach(function(n){ if(n) sheet.appendChild(n); });
  $overlayRoot.appendChild(ov);
  ov._onClose = onClose;
}
function closeOverlay(){ stopBreath(); clear($overlayRoot); }

/* ---------------- evolution celebration (gentle, not loud) ---------------- */
function celebrateEvolution(stage){
  openSheet(function(close){
    var kids = [
      E('div',{class:'grab'}),
      E('div',{class:'celebrate'},[
        E('div',{class:'petstage'},[E('div',{class:'petwrap',html:petSVG(stage,'great')})]),
        E('div',{class:'spark',text:'✨'}),
        E('h3',{text:'You’re both growing…'}),
        E('p',{class:'muted',text:pet()+' is becoming '+STAGE_NAMES[stage]+' — and so are you'+helperName()+': '+CHILD_GROWTH[stage]+'.'}),
        E('div',{class:'bubble',style:'margin:10px auto 0'},[E('span',{class:'who',text:pet()}),
          E('span',{text:'Look how far we’ve come. I grew because you were here — and you grew right alongside me. We’re stronger together.'})])
      ])
    ];
    kids.push(E('button',{class:'btn primary block',style:'margin-top:16px',on:{click:close}},'💚'));
    return kids;
  });
}

/* ---------------- boot ---------------- */
if(S.onboarded) countOpen();
render();
</script>
