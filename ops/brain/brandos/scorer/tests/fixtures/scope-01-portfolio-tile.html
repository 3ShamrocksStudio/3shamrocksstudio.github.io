<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fixture: portfolio tile in a product brand</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Instrument+Sans:wght@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>:root{--bg:#000;--ink:#f6f4ff;--violet:#8239ea}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif}
.tile-cr{background:#4b23d9;color:#ffd12e;font-family:'Bungee',cursive}
.tile-cr .name{color:#ffd12e}
.cta{color:#b07cff}</style></head><body>
<img src="../assets/studio/3shamrocks.png" alt="3Shamrocks Studio" width="300" height="44">
<h1>Brand systems for founders</h1>
<p>I design each product in its own brand.</p>
<div class="tile-cr" data-brand="chore-royale">
  <img src="../assets/brand-v3/chore-royale/logo-stacked-600.webp" width="200" height="80">
  <p class="name" style="background:#4b23d9;color:#ffd12e">Chore Royale</p>
  <svg width="10" height="10"><rect width="10" height="10" fill="#ff7a00"/></svg>
</div>
<section data-brand="studio"><p class="cta" style="color:#f6f4ff;background:#0d0a17">I answer every message myself.</p></section>
</body></html>
