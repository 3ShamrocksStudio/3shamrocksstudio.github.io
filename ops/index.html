<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3Shamrocks — Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#090912;--p1:#13132a;--p2:#1b1b3a;--ink:#eef0ff;--mut:#9ea3cf;--dim:#6b6f98;--line:rgba(255,255,255,.09);
 --pur:#8b5cff;--cyan:#22d3ee;--lime:#a3e635;--pink:#f472b6;--amber:#fbbf24;--green:#34d399;--blue:#60a5fa;--orange:#fb923c;
 --fd:"Space Grotesk",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif;--r:16px;--pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:1120px;margin:0 auto;padding:16px 14px 22px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
.pill{border-radius:var(--pill)}
/* banner */
.banner{position:relative;border-radius:var(--r);padding:16px 20px;overflow:hidden;background:linear-gradient(110deg,#5b2bd6,#7c3aed 40%,#0ea5b7);box-shadow:0 10px 40px rgba(124,58,237,.3)}
.banner::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 90% 0%,rgba(163,230,53,.25),transparent 70%);pointer-events:none}
.banner .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.banner .live{font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.banner .live .dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.35}}
.banner .goal{margin-left:auto;font-family:var(--fd);font-weight:700;font-size:13px;background:rgba(255,255,255,.15);padding:5px 12px;border-radius:var(--pill);border:1px solid rgba(255,255,255,.25)}
.banner .st{position:relative;z-index:1;font-family:var(--fd);font-weight:700;font-size:clamp(16px,2.4vw,21px);letter-spacing:-.01em;margin-top:9px;line-height:1.25}
.banner .st b{color:var(--lime)}
.banner .sub{position:relative;z-index:1;font-size:12px;color:rgba(255,255,255,.85);margin-top:4px}
/* body grid */
.body{display:grid;grid-template-columns:230px 1fr;gap:12px;flex:1;min-height:0}
@media(max-width:720px){.body{grid-template-columns:1fr;gap:10px}}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ph{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:12px 14px 8px}
/* product rail */
.rail{display:flex;flex-direction:column;gap:6px;padding:0 10px 10px;overflow-y:auto;max-height:420px}
@media(max-width:720px){.rail{flex-direction:row;max-height:none;overflow-x:auto;padding:0 10px 12px}}
.pchip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;flex:0 0 auto;min-width:0}
.pchip:hover{background:var(--p2)}
.pchip.sel{background:var(--p2);border-color:color-mix(in srgb,var(--ac) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 35%,transparent) inset}
.logo{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:13px;color:#06060f;overflow:hidden;background:var(--ac)}
.logo img{width:100%;height:100%;object-fit:contain;background:#0d0d1c;padding:3px}
.pchip .meta{min-width:0;flex:1}
.pchip .nm{font-family:var(--fd);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{height:5px;border-radius:var(--pill);background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--ac);border-radius:var(--pill);transition:width .4s}
.pchip .pc{font-size:10px;color:var(--mut);font-weight:700;font-family:var(--fd);flex:0 0 auto}
/* detail */
.detail{padding:14px 16px 16px;display:flex;flex-direction:column;gap:13px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead .logo{width:44px;height:44px;border-radius:11px;font-size:16px}
.dhead .t{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.01em}
.dhead .roi{margin-left:auto;text-align:right}
.dhead .roi b{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--ac)}
.dhead .roi span{display:block;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
/* scrubber timeline */
.tl{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px}
.tl-axis{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim);font-weight:600;margin-bottom:26px}
.scrub{position:relative;height:4px;background:rgba(255,255,255,.12);border-radius:var(--pill);margin:0 4px}
.scrub .prog{position:absolute;left:0;top:0;bottom:0;border-radius:var(--pill);background:linear-gradient(90deg,var(--ac),color-mix(in srgb,var(--ac) 40%,#fff));box-shadow:0 0 12px color-mix(in srgb,var(--ac) 60%,transparent);transition:width .35s}
.ms{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:default}
.ms .d{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--dim);transition:all .2s}
.ms.done .d{background:var(--ac);border-color:var(--ac);box-shadow:0 0 10px color-mix(in srgb,var(--ac) 70%,transparent)}
.ms .lab{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mut);white-space:nowrap;font-weight:600}
.ms .lab.below{bottom:auto;top:20px}
.ms.done .lab{color:var(--ink)}
.head{position:absolute;top:-9px;width:0;cursor:grab;touch-action:none;z-index:5}
.head.drag{cursor:grabbing}
.head b{position:absolute;left:-7px;width:14px;height:22px;border-radius:5px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.head b::after{content:"";position:absolute;left:5px;top:5px;width:4px;height:12px;border-left:1px solid #aaa;border-right:1px solid #aaa}
.readout{margin-top:34px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--mut);min-height:18px}
.readout .tag{font-family:var(--fd);font-weight:700;font-size:10px;padding:2px 8px;border-radius:var(--pill);background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}
.readout b{color:var(--ink);font-weight:700}
/* action + input */
.act{display:flex;gap:10px;align-items:flex-start;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.act .ab{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.act.you .ab{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.act.claude .ab{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.act .atxt{font-size:13px;font-weight:600;line-height:1.35}
.act .atxt small{display:block;font-weight:500;color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink);font-family:var(--fb);font-size:13px}
.inp input:focus{outline:none;border-color:var(--ac)}
.inp input::placeholder{color:var(--dim)}
.btn{border:none;border-radius:10px;padding:0 15px;font-family:var(--fd);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.btn-a{background:var(--ac);color:#06060f}.btn-a:active{transform:translateY(1px)}
.flash{font-size:11px;color:var(--lime);font-weight:600;min-height:14px}
/* waiting */
.waiting{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px}
.waiting .wh{font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.waiting .wh .n{background:var(--pink);color:#1a0812;font-weight:700;font-size:10px;padding:2px 8px;border-radius:var(--pill)}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.wc{display:inline-flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--line);border-radius:var(--pill);padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s}
.wc:hover{border-color:var(--pur)}
.wc .x{width:15px;height:15px;border-radius:5px;border:2px solid var(--dim);flex:0 0 auto}
.wc.done .x{background:var(--green);border-color:var(--green);position:relative}
.wc.done .x::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#06130c}
.wc.done span{color:var(--dim);text-decoration:line-through}
.about{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.about .ab-h{display:flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.about .stg{margin-left:auto;font-size:10px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent);padding:3px 10px;border-radius:var(--pill);text-transform:none;letter-spacing:0}
.about .ab-r{font-size:12.5px;line-height:1.5;color:var(--mut)}
.about .ab-r b{color:var(--ink);font-weight:700;font-family:var(--fd);font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-top:10px;margin-bottom:2px}
.about .ab-r b:first-child{margin-top:0}
.tier-b{font-size:9px;font-weight:700;padding:3px 8px;border-radius:var(--pill);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.t-money{background:color-mix(in srgb,var(--lime) 22%,transparent);color:var(--lime)}
.t-big{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.t-later{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
.t-parked{background:rgba(255,255,255,.08);color:var(--dim)}
.foot{text-align:center;color:var(--dim);font-size:10.5px;line-height:1.6}
.foot b{color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <div class="banner">
    <div class="top"><div class="live"><span class="dot"></span>Mission Control</div><div class="goal">🎯 $1M ARR</div></div>
    <div class="st" id="statusLine">—</div>
    <div class="sub" id="statusSub"></div>
  </div>

  <div class="body">
    <div class="panel"><div class="ph">Products · tap to open</div><div class="rail" id="rail"></div></div>
    <div class="panel"><div class="detail" id="detail"></div></div>
  </div>

  <div class="waiting">
    <div class="wh">⏳ Waiting on you <span class="n" id="wn">0</span><span style="font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim)">tap to check off</span></div>
    <div class="wlist" id="wlist"></div>
  </div>

  <div class="foot">One control panel, maintained by Claude · drag the handle to scan the timeline · check-offs &amp; notes persist on this device.<br><b>To make an update official, tap “＋log” and send the copied line to Claude in Dispatch.</b></div>
</div>

<script>
var LS={g:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},s:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
var DB=LS.g('ops_cp_v1',{ck:{},notes:{},sel:'j8nix'});
function save(){LS.s('ops_cp_v1',DB);}
function dn(id,def){return (id in DB.ck)?DB.ck[id]:!!def;}

var TH_IMG={
 shomer:'https://www.shomer-app.co.il/SHOMER_logo_big.png',
 nature:'https://www.shomer-app.co.il/nature-badge.png',
 th:'https://static.wixstatic.com/media/cf68b3_269e393ea39a46b891585fb6878d2d73~mv2.png/v1/fit/w_120,h_120,al_c,q_90,enc_auto/img.png'
};
// products: ms month-offsets along 0..18
var PROD=[
 {id:'j8nix',nm:'J8N.IX',ac:'var(--pur)',roi:'$35k',owner:'you',short:'set up payments',
  act:'1) Go to stripe.com and click “Sign up” (it’s free, ~5 min).  2) Once you’re logged in, tell me here.  → Then I connect it and it can take payments. You don’t touch any code.',
  ms:[{id:'j1',l:'Payments on',mo:1},{id:'j2',l:'First sale',mo:2.5},{id:'j3',l:'$10k/mo',mo:6},{id:'j4',l:'$35k/mo',mo:16}]},
 {id:'kit',nm:'AI Brand Kit',ac:'var(--lime)',roi:'$8k',owner:'claude',
  act:'Nothing for you — I’m adding new kits to the store.',
  ms:[{id:'k1',l:'Live',mo:0,def:true},{id:'k2',l:'First sales',mo:1},{id:'k3',l:'5 kits',mo:3},{id:'k4',l:'Scales',mo:10}]},
 {id:'ig',nm:'IG Network',ac:'var(--cyan)',roi:'$10k',owner:'you',short:'make the 4 IG accounts',
  act:'1) Open the Instagram app → tap “Sign up”.  2) Create 4 new accounts (keep your phone nearby — it texts you a code each time).  3) Tell me when they’re made → I hand you the names, bios and first posts.',
  ms:[{id:'g1',l:'4 accounts',mo:1},{id:'g2',l:'Posting daily',mo:3},{id:'g3',l:'First $',mo:4.5},{id:'g4',l:'Growing',mo:12}]},
 {id:'shomer',nm:'SH✡MER',ac:'var(--amber)',roi:'$30k',logo:'shomer',owner:'you',short:'add 12 testers',
  act:'On a computer, go to play.google.com/console → open SH✡MER → left menu “Testing” → “Internal testing” → “Testers” tab → paste in 12 email addresses → click Save. (That starts the 14-day countdown.)',
  ms:[{id:'s1',l:'In testing',mo:0,def:true},{id:'s2',l:'12 testers',mo:1},{id:'s3',l:'ID verified',mo:1.5},{id:'s4',l:'Public',mo:3},{id:'s5',l:'First sale',mo:8}]},
 {id:'th',nm:'Trashure-Hunters',ac:'var(--green)',roi:'IP',logo:'th',owner:'claude',
  act:'Nothing for you — I’m finishing the app.',
  ms:[{id:'t1',l:'Core built',mo:0,def:true},{id:'t2',l:'Screens',mo:1},{id:'t3',l:'Test build',mo:2}]},
 {id:'nature',nm:'SHOMER Nature',ac:'var(--blue)',roi:'rides SHOMER',logo:'nature',owner:'you',short:'open the Nature listing',
  act:'Play Console (play.google.com/console) → “Create app” → name it “SHOMER Nature”. Tell me once it exists → I fill in every field, text and image for you.',
  ms:[{id:'n1',l:'Built',mo:0,def:true},{id:'n2',l:'Listing',mo:2},{id:'n3',l:'Live',mo:3}]},
 {id:'chore',nm:'Chore Royale',ac:'var(--orange)',roi:'opt-in',owner:'hold',
  act:'Parked — nothing to do. We revisit only if Instagram pulls in a family crowd.',
  ms:[{id:'c1',l:'Built',mo:0,def:true},{id:'c2',l:'Payments',mo:4}]},
 {id:'ezra',nm:'Ezra',ac:'var(--pink)',roi:'concept',owner:'hold',
  act:'Parked — nothing to do right now.',
  ms:[{id:'e1',l:'Concept',mo:0,def:true},{id:'e2',l:'Build core',mo:6}]},
 {id:'fair',nm:'Fairent',ac:'var(--blue)',roi:'PoC',owner:'hold',
  act:'Parked — blocked until we get rent-price data. Nothing for you.',
  ms:[{id:'f1',l:'Prototype',mo:0,def:true},{id:'f2',l:'Get data',mo:5}]},
 {id:'milo',nm:'Milo',ac:'var(--pink)',roi:'concept',owner:'hold',
  act:'Parked — a child-safety expert must review it first. Nothing for you.',
  ms:[{id:'m1',l:'Design',mo:0,def:true},{id:'m2',l:'Expert review',mo:4}]}
];
var WAIT=[
 {id:'w_ops',t:'Open the Scheduled list (sidebar) → find “3SDS Daily Ops” → switch it ON'},
 {id:'w_ig',t:'Instagram app → Sign up → make 4 new accounts (phone needed for the code)'},
 {id:'w_testers',t:'play.google.com/console → SH✡MER → Testing → Internal → Testers → paste 12 emails → Save'},
 {id:'w_verify',t:'Play Console → Settings → finish the ID check it asks you for'},
 {id:'w_stripe',t:'stripe.com → “Sign up” (free) → tell me when you’re logged in'},
 {id:'w_domain',t:'Where you bought 3shamrocks.com → DNS settings → tell me the host, I’ll give exact values'}
];
var META={
 j8nix:{tier:'money',stage:'Live preview',what:'An all-in-one work dashboard — calendar, tasks, projects, a voice assistant — in one page. For solo founders & small teams.',earn:'A monthly subscription. This is the main recurring engine toward $1M.'},
 kit:{tier:'money',stage:'Selling (Gumroad)',what:'Ready-made AI brand kits — logos, templates, guidelines — as instant downloads. For founders & creators who need a brand fast.',earn:'One-time sales now → a small membership next. The fastest first dollar we have.'},
 ig:{tier:'money',stage:'Pages built, not live',what:'4 themed AI/brand Instagram pages that pull in an audience and point it at everything we sell.',earn:'Affiliate links + promoting our own products. This is the traffic engine behind every sale.'},
 shomer:{tier:'big',stage:'In Google Play testing',what:'A one-tap citizen safety network with a live city dashboard. For neighbourhoods & municipalities.',earn:'Paid community / municipal licences. Biggest ceiling, but the slowest kind of sale.'},
 nature:{tier:'big',stage:'Built, needs store listing',what:'The nature version of SH✡MER — wildfire, illegal dumping, injured wildlife.',earn:'Rides the same licence model as SH✡MER.'},
 th:{tier:'later',stage:'Web MVP + case study',what:'A real-world cleanup game with original monster characters. For players & eco-brands.',earn:'Later — through a funding raise or licensing the characters, not near-term sales.'},
 chore:{tier:'parked',stage:'Prototype + landing',what:'A family game that turns chores into quests. For parents & kids.',earn:'Family subscription — parked until there is an audience to sell to.'},
 ezra:{tier:'parked',stage:'Concept + mockups',what:'A Hebrew-first AI helper that does digital tasks FOR seniors, not just explains them.',earn:'Subscription / grants — parked; the core “do-it-for-me” engine isn’t built yet.'},
 fair:{tier:'parked',stage:'Prototype (PoC)',what:'Tells renters if they’re overpaying and how to negotiate it down.',earn:'Freemium / leads — parked until we get legal rent-price data.'},
 milo:{tier:'parked',stage:'Design',what:'A gentle companion app that builds real resilience in at-risk kids.',earn:'NGO/school + parent plans — parked until a child-safety expert reviews it.'}
};
var TIER={money:['t-money','💰 Money now'],big:['t-big','🛡 Big bet'],later:['t-later','🎬 Later'],parked:['t-parked','⏸ Parked']};
var MAXMO=18;
function prodById(id){return PROD.filter(function(p){return p.id===id;})[0];}
function doneCount(p){return p.ms.filter(function(m){return dn(m.id,m.def);}).length;}
function progMo(p){var mx=0;p.ms.forEach(function(m){if(dn(m.id,m.def)&&m.mo>mx)mx=m.mo;});return mx;}
function pct(p){return Math.round(progMo(p)/MAXMO*100);}
function logoHTML(p){var big=arguments[1];var cls=big?'logo':'logo';
 if(p.logo&&TH_IMG[p.logo])return '<div class="'+cls+'" style="--ac:'+p.ac+';background:#0d0d1c"><img src="'+TH_IMG[p.logo]+'" alt=""></div>';
 var m=p.nm.replace(/[^A-Za-z֐-׿]/g,'').slice(0,2).toUpperCase();
 return '<div class="'+cls+'" style="--ac:'+p.ac+'">'+m+'</div>';}

function renderRail(){
 document.getElementById('rail').innerHTML=PROD.map(function(p){
  var mo=(META[p.id]&&META[p.id].tier==='money')?'💰 ':'';
  return '<div class="pchip'+(p.id===DB.sel?' sel':'')+'" data-sel="'+p.id+'" style="--ac:'+p.ac+'">'+logoHTML(p)+
   '<div class="meta"><div class="nm">'+mo+p.nm+'</div><div class="mini"><i style="width:'+pct(p)+'%"></i></div></div><div class="pc">'+pct(p)+'%</div></div>';
 }).join('');
}
function renderDetail(){
 var p=prodById(DB.sel); if(!p){DB.sel='j8nix';p=prodById('j8nix');}
 var ph=progMo(p)/MAXMO*100;
 var dots=p.ms.map(function(m,i){var md=dn(m.id,m.def);var x=m.mo/MAXMO*100;
  return '<div class="ms'+(md?' done':'')+'" style="left:'+x+'%"><span class="lab'+(i%2?' below':'')+'">'+m.l+'</span><span class="d"></span></div>';}).join('');
 var ownerCls=p.owner==='claude'?'claude':(p.owner==='hold'?'claude':'you');
 var ownLab=p.owner==='you'?'You · do this':(p.owner==='claude'?'Claude handling':'On hold');
 var ownIcon=p.owner==='you'?'➤':(p.owner==='claude'?'🤖':'⏸');
 var mt=META[p.id]||{tier:'parked',stage:'',what:'',earn:''}; var tb=TIER[mt.tier];
 document.getElementById('detail').innerHTML=
  '<div class="dhead" style="--ac:'+p.ac+'">'+logoHTML(p,true)+'<div class="t">'+p.nm+' <span class="tier-b '+tb[0]+'">'+tb[1]+'</span></div><div class="roi"><b>'+p.roi+'</b><span>target</span></div></div>'+
  '<div class="about" style="--ac:'+p.ac+'"><div class="ab-h">📋 About this project <span class="stg">'+mt.stage+'</span></div><div class="ab-r"><b>What it is</b>'+mt.what+'<b>How it makes money</b>'+mt.earn+'</div></div>'+
  '<div class="tl" style="--ac:'+p.ac+'"><div class="tl-axis"><span>Now</span><span>+3</span><span>+6</span><span>+9</span><span>+12</span><span>+18mo</span></div>'+
    '<div class="scrub" id="scrub"><div class="prog" style="width:'+ph+'%"></div>'+dots+'<div class="head" id="head" style="left:'+ph+'%"><b></b></div></div>'+
    '<div class="readout" id="readout"></div></div>'+
  '<div class="act '+ownerCls+'" style="--ac:'+p.ac+'"><div class="ab">'+ownIcon+'</div><div class="atxt"><small>'+ownLab+'</small>'+p.act+'</div></div>'+
  '<div class="inp"><input id="noteIn" placeholder="log a progress update for '+p.nm+'…"><button class="btn btn-a" id="advBtn" style="--ac:'+p.ac+'">＋ log + advance</button></div>'+
  '<div class="flash" id="flash"></div>';
 setReadout(ph);
 wireScrub(p);
}
function setReadout(phPct){
 var p=prodById(DB.sel);var phMo=phPct/100*MAXMO;
 var near=p.ms[0],best=1e9;p.ms.forEach(function(m){var d=Math.abs(m.mo-phMo);if(d<best){best=d;near=m;}});
 var md=dn(near.id,near.def);var done=doneCount(p);
 var el=document.getElementById('readout');if(!el)return;
 el.innerHTML='<span class="tag">+'+(Math.round(phMo*10)/10)+'mo</span> <b>'+near.l+'</b> — '+(md?'✓ done':'upcoming')+' · <span style="color:var(--dim)">'+done+'/'+p.ms.length+' milestones complete</span>';
}
function wireScrub(p){
 var scrub=document.getElementById('scrub'),head=document.getElementById('head');if(!scrub)return;
 function setPct(px){var r=scrub.getBoundingClientRect();var pc=Math.max(0,Math.min(100,(px-r.left)/r.width*100));head.style.left=pc+'%';setReadout(pc);}
 function down(e){head.classList.add('drag');e.preventDefault();var mv=function(ev){var x=(ev.touches?ev.touches[0].clientX:ev.clientX);setPct(x);};
  var up=function(){head.classList.remove('drag');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);}
 head.addEventListener('pointerdown',down);
 scrub.addEventListener('pointerdown',function(e){if(e.target===head||head.contains(e.target))return;setPct(e.clientX);down(e);});
}
function renderWait(){
 var open=WAIT.filter(function(w){return !dn(w.id);}).length;
 document.getElementById('wn').textContent=open;
 document.getElementById('wlist').innerHTML=WAIT.map(function(w){return '<div class="wc'+(dn(w.id)?' done':'')+'" data-ck="'+w.id+'"><span class="x"></span><span>'+w.t+'</span></div>';}).join('');
}
function renderStatus(){
 var youOpen=PROD.filter(function(p){return p.owner==='you'&&doneCount(p)<p.ms.length;});
 var waitOpen=WAIT.filter(function(w){return !dn(w.id);}).length;
 var first=youOpen[0];
 document.getElementById('statusLine').innerHTML= youOpen.length>0
   ? '<b>'+youOpen.length+'</b> thing'+(youOpen.length>1?'s':'')+' need you · start with: '+(first?first.nm+' — '+(first.short||'open it'):'—')
   : 'All your actions clear — <b>Claude is driving</b>.';
 document.getElementById('statusSub').textContent='Tap a product to open its timeline · '+PROD.length+' tracks · updated '+new Date().toISOString().slice(0,10);
}
function renderAll(){renderRail();renderDetail();renderWait();renderStatus();}
renderAll();

document.body.addEventListener('click',function(e){
 var sel=e.target.closest('[data-sel]');if(sel){DB.sel=sel.getAttribute('data-sel');save();renderAll();return;}
 var ck=e.target.closest('[data-ck]');if(ck){var id=ck.getAttribute('data-ck');DB.ck[id]=!dn(id);save();renderWait();renderStatus();return;}
 if(e.target.closest('#advBtn')){advance();return;}
});
function advance(){
 var p=prodById(DB.sel);var inp=document.getElementById('noteIn');var txt=(inp.value||'').trim();
 var next=null;p.ms.forEach(function(m){if(!next&&!dn(m.id,m.def))next=m;});
 if(next){DB.ck[next.id]=true;}
 if(txt){ (DB.notes[p.id]=DB.notes[p.id]||[]).unshift({ts:Date.now(),text:txt}); }
 save();renderAll();
 var line='📋 '+p.nm+' update — '+new Date().toISOString().slice(0,16).replace('T',' ')+': '+(txt||('marked “'+(next?next.l:'done')+'” complete'))+'  → (recompute Mission Control.)';
 var f=document.getElementById('flash');
 function okd(){if(f)f.textContent='✓ advanced'+(next?' to “'+next.l+'”':'')+' · line copied → paste to Claude in Dispatch';}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(line).then(okd,function(){fb(line);okd();});}else{fb(line);okd();}
}
function fb(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(_){}document.body.removeChild(ta);}
</script>
</body>
