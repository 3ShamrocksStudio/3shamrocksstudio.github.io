<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>Shomer 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Alef:wght@400;700&family=Heebo:wght@400;500;700;800&family=Dela+Gothic+One&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ds/tokens.css"><link rel="stylesheet" href="../ds/brand-shomer.css">
<style>
body,html{background:var(--paper)}
.post{background:var(--paper);padding:0}
.bar{background:var(--bg);height:200px;padding:0 var(--gutter);display:flex;align-items:center;justify-content:space-between;direction:ltr}
.bar img{height:56px}
.chip{font-weight:700;font-size:var(--text-sm);color:var(--accent-text);border:2px solid var(--accent);border-radius:999px;padding:var(--space-2) var(--space-5)}
.body{padding:var(--space-8) var(--gutter) 0;position:relative;flex:1}
h1{font-weight:700;font-size:var(--text-5xl);line-height:1.02;color:var(--ink)}
h1 span{display:inline-block;border-bottom:12px solid var(--accent);padding-bottom:2px}
.lead{margin-top:var(--space-5);font-size:var(--text-base);color:var(--ink-2);max-width:904px;line-height:1.35}
.row{position:absolute;inset-inline:var(--gutter);bottom:0;top:430px;display:flex;gap:var(--space-8);align-items:flex-start}
.phone{width:420px;flex:none;border-radius:36px 36px 0 0;overflow:hidden;box-shadow:0 18px 40px -24px rgba(22,32,46,.5);border:2px solid var(--ink);border-bottom:0;direction:ltr;background:#000}
.phone img{display:block;width:100%}
.pts{flex:1;display:flex;flex-direction:column;gap:var(--space-5)}
.card{background:var(--card);border-radius:14px;padding:var(--space-5);box-shadow:0 1px 0 rgba(22,32,46,.04),0 18px 40px -24px rgba(22,32,46,.28);border:1px solid #dde1ea}
.card b{display:block;font-size:var(--text-xl);color:var(--ink);line-height:1.15}
.card span{display:block;margin-top:6px;font-size:var(--text-sm);color:var(--ink-2);line-height:1.3}
.card i{display:inline-block;font-style:normal;font-weight:700;font-size:var(--text-xs);color:var(--safe);margin-bottom:var(--space-2)}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:var(--text-xl);padding:var(--space-5) var(--space-6);border-radius:10px;text-align:center;line-height:1.2}
</style></head>
<body data-brand="shomer"><main class="post">
<div class="bar"><img src="../img/wordmark-white.svg" alt="SH✡MER"><div class="chip">בטא סגורה · אנדרואיד</div></div>
<div class="body">
<h1 class="display"><span>המעגל שלך.</span><br>הבחירה שלך.</h1>
<p class="lead">כל תושב בוחר מי השומרים שלו. בלי מעקב, ובלי שיתוף ללא הסכמה.</p>
<div class="row">
 <div class="phone"><img src="../img/app-circles.webp" alt="SH✡MER app: My SH✡MERs circles"></div>
 <div class="pts">
  <div class="card"><i>✓ פרטיות</i><b>השומרים שלי</b><span>מי בא אליך כשצריך, באישור הדדי בלבד</span></div>
  <div class="card"><i>✓ פרטיות</i><b>בלי שמות</b><span>בלוח הבקרה של הקהילה</span></div>
  <div class="btn">רוצים לבדוק?<br>שלחו לנו: &quot;בודק&quot;</div>
 </div>
</div>
</div>
</main></body></html>
