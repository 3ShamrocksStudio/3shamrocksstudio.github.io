<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>Shomer 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Alef:wght@400;700&family=Heebo:wght@400;500;700;800&family=Dela+Gothic+One&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ds/tokens.css"><link rel="stylesheet" href="../ds/brand-shomer.css">
<style>
.post{background:radial-gradient(900px 700px at 20% 105%,rgba(252,153,24,.22),transparent 65%),linear-gradient(180deg,#0C1B3A 0%,#08152F 100%)}
.top{display:flex;justify-content:space-between;align-items:center;direction:ltr}
.top img{height:56px;display:block}
.chip{font-weight:700;font-size:var(--text-sm);color:var(--accent-text);border:2px solid var(--accent);border-radius:999px;padding:var(--space-2) var(--space-5)}
h1{margin-top:var(--space-8);font-weight:700;font-size:var(--text-5xl);line-height:1.02}
h1 em{font-style:normal;color:var(--accent-text)}
.lead{margin-top:var(--space-5);font-size:var(--text-lg);color:var(--text-2);max-width:900px}
.row{position:absolute;inset-inline:var(--gutter);bottom:0;top:560px;display:flex;gap:var(--space-8);align-items:flex-start}
.phone{width:440px;flex:none;border-radius:36px 36px 0 0;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.22);border-bottom:0;direction:ltr}
.phone img{display:block;width:100%}
.pts{flex:1;display:flex;flex-direction:column;gap:var(--space-5);padding-top:var(--space-3)}
.pt{font-size:var(--text-xl);font-weight:700;line-height:1.15;padding:var(--space-4) var(--space-5);border-inline-start:6px solid var(--accent);background:rgba(255,255,255,.07);border-radius:10px}
.pt small{display:block;margin-top:4px;font-weight:400;font-size:var(--text-sm);color:var(--text-2)}
.btn{margin-top:var(--space-4);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:var(--text-xl);padding:var(--space-5) var(--space-6);border-radius:10px;text-align:center;line-height:1.2}
</style></head>
<body data-brand="shomer"><main class="post">
<div class="top"><img src="../img/wordmark-white.svg" alt="SH✡MER"><div class="chip">בטא סגורה · אנדרואיד</div></div>
<h1 class="display">מי שכבר נמצא<br><em>דקה ממך.</em></h1>
<p class="lead">לחיצה על SOS, והשומרים שבחרת רואים איפה אתה.</p>
<div class="row">
 <div class="phone"><img src="../img/app-route.webp" alt="SH✡MER app: route to an SOS event"></div>
 <div class="pts">
  <div class="pt">מיקום חי<small>נשלח רק לשומרים שבחרת</small></div>
  <div class="pt">חינם לתושבים<small>תמיד</small></div>
  <div class="pt">משלים את 100<small>לא מחליף</small></div>
  <div class="btn">רוצים לבדוק?<br>שלחו לנו: &quot;בודק&quot;</div>
 </div>
</div>
</main></body></html>
