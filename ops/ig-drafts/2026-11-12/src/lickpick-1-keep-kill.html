<!doctype html><html lang="en"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>LickPick 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Alef:wght@400;700&family=Heebo:wght@400;500;700;800&family=Dela+Gothic+One&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ds/tokens.css"><link rel="stylesheet" href="../ds/brand-lickpick.css">
<style>
.post{background:var(--bg)}
.amp{position:absolute;left:0;right:0;top:0;height:20px;background:linear-gradient(90deg,#FF2E88 0 25%,#B47CFF 25% 50%,#FFE600 50% 75%,#2BE7FF 75% 100%)}
.top{margin-top:var(--space-4);display:flex;align-items:center;gap:var(--space-4)}
.mark{width:72px;height:70px}
.wm{font-family:var(--font-display);font-size:var(--text-xl);color:var(--text)}
.wm b{color:var(--accent-text)}
.beta{font-weight:800;font-size:var(--text-xs);letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);border:3px solid var(--ink);border-radius:999px;padding:2px var(--space-4);box-shadow:3px 3px 0 var(--accent-2)}
h1{font-weight:400;font-size:var(--text-4xl);line-height:1.02;text-transform:uppercase;letter-spacing:0}
h1 em{font-style:normal;color:var(--accent-text)}
.stamp{display:inline-flex;align-items:center;gap:var(--space-3);font-family:var(--font-body);font-weight:800;font-size:var(--text-lg);text-transform:uppercase;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:var(--space-3) var(--space-5);box-shadow:4px 4px 0 var(--accent-2)}
.phone{border:4px solid var(--ink);outline:3px solid var(--border);border-radius:34px;overflow:hidden;box-shadow:12px 12px 0 var(--accent-2);background:#000}
.phone img{display:block;width:100%}

h1{margin-top:var(--space-8)}
.col{width:480px}
.stamps{margin-top:var(--space-7);display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-4)}
.s1{background:var(--keep)}.s2{background:var(--review)}.s3{background:var(--trash)}
.s1{transform:rotate(-2deg)}.s2{transform:rotate(1.5deg)}.s3{transform:rotate(-1deg)}
.note{margin-top:var(--space-7);font-size:var(--text-sm);font-weight:700;color:var(--text-2);line-height:1.3}
.phone{position:absolute;right:76px;top:350px;width:410px;transform:rotate(4deg)}
</style></head>
<body data-brand="lickpick"><main class="post">
<div class="amp"></div>
<div class="top"><svg class="mark" viewBox="0 0 108 106" aria-label="LickPick"><defs><path id="pk" d="M50 97C45 97 41 93 36 86C24 70 6 48 6 30C6 12 24 4 50 4S94 12 94 30C94 48 76 70 64 86C59 93 55 97 50 97Z"/></defs><use href="#pk" transform="translate(7 5)" fill="#FF2E88"/><use href="#pk" fill="#FFE600" stroke="#07060B" stroke-width="4" stroke-linejoin="round"/><path d="M40 30.5v27c0 3 3.2 4.8 5.8 3.2l21.5-13.5c2.4-1.5 2.4-5 0-6.4L45.8 27.3C43.2 25.7 40 27.5 40 30.5Z" fill="#07060B"/></svg><div class="wm">Lick<b>Pick</b></div><div class="beta">BETA</div></div>
<div class="col">
<h1 class="display">Keep the <em>licks.</em><br>Kill the flubs.</h1>
<div class="stamps"><span class="stamp s1">✓ Keep</span><span class="stamp s2">? Review</span><span class="stamp s3">✕ Trash</span></div>
<p class="note">Every jam gets a stamp.<br>Free beta · Android + desktop Chrome</p>
</div>
<div class="phone"><img src="../img/app-home.webp" alt="LickPick app: Your jams"></div>
</main></body></html>
