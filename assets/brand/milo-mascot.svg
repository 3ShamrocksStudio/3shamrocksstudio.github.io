<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Milo mascot">
  <defs>
    <radialGradient id="mBody" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFB08A"/>
      <stop offset="45%" stop-color="#F07A4E"/>
      <stop offset="100%" stop-color="#D1522B"/>
    </radialGradient>
    <radialGradient id="mBelly" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFF4E8"/>
      <stop offset="100%" stop-color="#FFE0C6"/>
    </radialGradient>
    <radialGradient id="mEar" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#F58C5E"/>
      <stop offset="100%" stop-color="#C94B26"/>
    </radialGradient>
    <linearGradient id="mRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD9BE" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FFD9BE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="mEye" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#4a2b1e"/>
      <stop offset="100%" stop-color="#1c0f0a"/>
    </radialGradient>
    <filter id="mSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8a2f12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="110" cy="196" rx="58" ry="12" fill="#000" opacity="0.18"/>

  <g filter="url(#mSoft)">
    <!-- ears -->
    <path d="M58 70 C50 36 70 24 86 44 C92 52 92 64 88 74 Z" fill="url(#mEar)"/>
    <path d="M162 70 C170 36 150 24 134 44 C128 52 128 64 132 74 Z" fill="url(#mEar)"/>
    <path d="M66 62 C62 46 72 40 80 52 Z" fill="#FFCBAE" opacity="0.8"/>
    <path d="M154 62 C158 46 148 40 140 52 Z" fill="#FFCBAE" opacity="0.8"/>

    <!-- body/head -->
    <path d="M110 44
             C156 44 178 78 178 118
             C178 164 148 190 110 190
             C72 190 42 164 42 118
             C42 78 64 44 110 44 Z" fill="url(#mBody)"/>
    <!-- top rim light -->
    <path d="M110 44 C156 44 178 78 178 118 C178 92 150 70 110 70 C70 70 42 92 42 118 C42 78 64 44 110 44 Z" fill="url(#mRim)"/>

    <!-- belly -->
    <path d="M110 108 C138 108 152 128 152 150 C152 172 134 188 110 188 C86 188 68 172 68 150 C68 128 82 108 110 108 Z" fill="url(#mBelly)"/>

    <!-- eyes -->
    <ellipse cx="86" cy="108" rx="15" ry="17" fill="#fff"/>
    <ellipse cx="134" cy="108" rx="15" ry="17" fill="#fff"/>
    <circle cx="88" cy="110" r="8.5" fill="url(#mEye)"/>
    <circle cx="132" cy="110" r="8.5" fill="url(#mEye)"/>
    <circle cx="85" cy="106" r="3" fill="#fff"/>
    <circle cx="129" cy="106" r="3" fill="#fff"/>

    <!-- blush -->
    <ellipse cx="66" cy="130" rx="10" ry="6" fill="#FF6E6E" opacity="0.35"/>
    <ellipse cx="154" cy="130" rx="10" ry="6" fill="#FF6E6E" opacity="0.35"/>

    <!-- nose + smile -->
    <path d="M104 126 Q110 132 116 126 Q110 130 104 126 Z" fill="#7a2f16"/>
    <path d="M96 138 Q110 150 124 138" stroke="#7a2f16" stroke-width="3.2" fill="none" stroke-linecap="round"/>

    <!-- little sprout (studio nod) -->
    <path d="M110 44 C110 30 118 24 122 28 C120 36 114 42 110 44 Z" fill="#6BBF2E"/>
    <path d="M110 46 C108 34 100 30 96 34 C100 42 106 46 110 46 Z" fill="#53D805" opacity="0.9"/>
  </g>
</svg>
