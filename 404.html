<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Level not found · 3Shamrocks Studio</title>
<meta name="description" content="This level does not exist. Head back to the homepage or the work section.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--ink:#f6f4ff;--ink-2:rgba(236,232,255,.76);--violet:#8239ea;--violet-2:#b07cff;--green:#8be36a;--line:rgba(255,255,255,.12);
--font-d:'Bricolage Grotesque',system-ui,sans-serif;--font-b:'Instrument Sans',system-ui,sans-serif;color-scheme:dark}
html,body{min-height:100%;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body{font-family:var(--font-b);font-size:16px;line-height:1.6;display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:32px 16px;
background:radial-gradient(60% 50% at 50% 38%,rgba(130,57,234,.28),transparent 70%),var(--bg)}
main{text-align:center;max-width:560px;width:100%}
.hud{display:inline-flex;gap:14px;font:600 12px var(--font-b);letter-spacing:.14em;text-transform:uppercase;color:var(--violet-2);border:1px solid var(--line);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.hud b{color:var(--green);font-weight:600}
h1{font:800 clamp(96px,26vw,200px)/.9 var(--font-d);letter-spacing:-.06em;background:linear-gradient(160deg,#fff 10%,var(--violet-2) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:800 clamp(26px,6vw,38px)/1.1 var(--font-d);letter-spacing:-.03em;margin:14px 0 10px}
p{color:var(--ink-2);margin:0 auto 28px;max-width:440px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;font:600 15px var(--font-b);padding:12px 22px;border-radius:3px;text-decoration:none;border:1px solid var(--violet);color:var(--ink);transition:transform .2s,background .2s}
.btn-p{background:var(--violet)}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);background:var(--violet)}
.btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.try{margin-top:30px;font:500 13px var(--font-b);color:var(--ink-2);opacity:.7}
@media(prefers-reduced-motion:no-preference){h1{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px)}}}
</style>
<script src="js/hits.js" defer></script>
</head>
<body>
<main>
  <div class="hud" aria-hidden="true"><span>Lives <b>0</b></span><span>Score <b>404</b></span></div>
  <h1>404</h1>
  <h2>Level not found</h2>
  <p>You walked off the map. This level was never built, or it moved. Pick a path and keep playing.</p>
  <div class="row">
    <a class="btn btn-p" href="/">Back to the homepage</a>
    <a class="btn" href="/#work">See the work</a>
  </div>
  <div class="try">Press start: try another route.</div>
</main>
</body>
</html>
