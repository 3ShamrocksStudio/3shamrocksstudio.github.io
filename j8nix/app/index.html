<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>J8NIX</title>
<meta name="description" content="J8NIX · Smart Operations OS, only smarter">
<meta name="theme-color" content="#586475">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="J8NIX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shell.css?v=4.1.0">
</head>
<body>
<!-- J8NIX v4 PWA shell. Screens come from the new UI; data comes from window.J8 (j8-data.js). -->
<header class="hero">
  <img src="icons/wm-slate.svg" alt="J8NIX" width="160" height="56">
  <p>Smart Operations OS, only smarter</p>
</header>

<main>
  <section id="vAuth" hidden>
    <form id="fEmail" class="step">
      <label for="email">Your work email</label>
      <input id="email" type="email" inputmode="email" autocomplete="email" required placeholder="you@company.com">
      <button class="btn blue" type="submit">Email me a sign-in link</button>
    </form>
    <form id="fPaste" class="step" hidden>
      <p class="lead">Check your email on this phone.</p>
      <p class="hint">Press and hold the link → Copy → paste it here.</p>
      <textarea id="pasteLink" rows="3" placeholder="Paste the link" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <button class="btn blue" type="submit">Sign in</button>
      <button class="btn plain" type="button" id="again">Use another email</button>
    </form>
    <p class="ios" id="iosHint" hidden>iPhone: tap Share → <b>Add to Home Screen</b> first, then open J8NIX from there.</p>
  </section>

  <section id="vReady" hidden>
    <p class="lead" id="hello"></p>
    <ul class="facts" id="facts"></ul>
    <p class="hint">New screens are on the way. Your data is live and safe here.</p>
    <label class="row" id="orgRow" hidden><span>Business</span><select id="orgSel"></select></label>
    <div class="row"><span>Alerts on this phone</span><button class="btn small" id="pushBtn">Turn on</button></div>
    <div class="row"><span id="who"></span><button class="btn small plain" id="signOut">Sign out</button></div>
  </section>

  <p class="msg" id="msg" role="status"></p>
</main>

<script src="vendor/supabase.js?v=2.45.4"></script>
<script src="j8-data.js?v=4.1.0"></script>
<script src="shell.js?v=4.1.0"></script>
</body>
</html>
