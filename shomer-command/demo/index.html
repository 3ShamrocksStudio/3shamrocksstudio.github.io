<style>
html,body{height:100%}
body{background:var(--n0);color:var(--tx0)}
.dbar{position:relative;z-index:30;height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--n0);border-bottom:1px solid rgba(245,200,64,.28)}
.dbar .brand{display:flex;align-items:center;gap:12px}
.dbar .wordmark{width:118px}
.dbar .brand small{font-size:11.5px}
.dbar .demo-tag{font-size:15px;padding:7px 16px 7px 13px}
.dbar .sp{flex:1}
.dbar .prog{font-size:14px;color:var(--tx2);white-space:nowrap}
.dbar .prog b{color:#fff}
.dbar .x{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--tx1);padding:0 6px;white-space:nowrap}
.dbar .x:hover{color:#fff}
.stage{position:relative;height:calc(100% - 64px);overflow:hidden;background:#08142c}
#dash{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#spot{position:absolute;z-index:10;pointer-events:none;border:2px solid var(--g4);border-radius:14px;box-shadow:0 0 0 4000px rgba(6,15,30,.58),0 0 0 6px rgba(245,200,64,.18),0 0 34px rgba(245,200,64,.35);transition:all .38s cubic-bezier(.3,.7,.2,1);opacity:0}
#spot.on{opacity:1}
#spot.full{border-color:transparent;box-shadow:0 0 0 4000px rgba(6,15,30,.72)}
#loader{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:#08142c;color:var(--tx1);font-size:17px;transition:opacity .3s ease}
#loader.off{opacity:0;pointer-events:none}
#loader .ring{width:46px;height:46px;border-radius:50%;border:3px solid rgba(245,200,64,.2);border-top-color:var(--g3);animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* tour card */
.tcard{position:absolute;z-index:20;width:392px;bottom:24px;inset-inline-start:24px;background:#fff;color:var(--ink);border-radius:20px;padding:24px 24px 20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.65),0 0 0 1px rgba(14,29,58,.08);transition:inset .35s ease,transform .35s ease,opacity .25s ease}
.tcard.left{inset-inline-start:auto;inset-inline-end:24px}
.tcard.center{bottom:50%;inset-inline-start:50%;transform:translate(50%,50%);width:min(520px,calc(100% - 40px));padding:34px 34px 26px}
.tcard.hide{opacity:0;pointer-events:none;transform:translateY(12px)}
.tk{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;font-weight:700;color:var(--g2)}
.tk .num{color:var(--ink3);font-weight:600}
.tcard h2{margin-top:10px;font-size:24px;line-height:1.25;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.tcard.center h2{font-size:30px}
.tcard .body{margin-top:10px;font-size:16.5px;line-height:1.6;color:var(--ink2)}
.tcard .adv{margin-top:14px;display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 14px;border-radius:12px;background:rgba(224,168,40,.12);font-size:15.5px;line-height:1.5;color:var(--ink)}
.tcard .adv svg{width:22px;height:22px}
.tcard .adv b{font-weight:800}
.tcard .note{margin-top:12px;font-size:13.5px;color:var(--ink3)}
.tnav{margin-top:20px;display:flex;align-items:center;gap:10px}
.tnav .sp{flex:1}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--hair2);transition:all .2s ease}
.dots i.on{width:20px;border-radius:4px;background:var(--g2)}
.bprev{min-height:44px;padding:0 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink2)}
.bprev:hover{background:rgba(14,29,58,.05)}
.bprev[disabled]{visibility:hidden}
.tcard .btn{min-height:46px;padding:0 22px;font-size:16px}
.tnav .btn{width:auto}
.endcta{margin-top:20px;display:grid;gap:10px}
.endcta .btn,.endcta .btn-ghost{width:100%}
.endcta .btn-ghost{color:var(--ink);border-color:var(--hair2)}
.endcta .plain{display:flex;align-items:center;justify-content:center;min-height:44px;font-size:15px;font-weight:600;color:var(--ink2);padding:4px 8px;text-align:center}
.endcta a.plain{text-decoration:underline;text-decoration-color:rgba(192,144,32,.7);text-underline-offset:4px}
.tshot{display:none}
#pill{position:absolute;z-index:20;bottom:24px;inset-inline-start:24px;display:none;gap:10px}
#pill.on{display:flex}
#pill button{min-height:48px;padding:0 20px;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:15.5px;box-shadow:0 16px 40px -12px rgba(0,0,0,.6)}

/* ══ phone / tablet: story mode with real screenshots of each step ══ */
.story-note{display:none}
@media screen and (max-width:1099px){
  html,body{height:auto}
  .dbar{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 16px;gap:10px 14px}
  .dbar .prog,.dbar .btn{display:none}
  .stage{height:auto;overflow:visible;background:var(--n0);padding:18px 16px 32px}
  #dash,#spot,#loader,#pill{display:none!important}
  .tcard,.tcard.left,.tcard.center{position:relative;inset:auto;transform:none;width:100%;max-width:560px;margin:0 auto;padding:20px 20px 18px}
  .tcard.center h2,.tcard h2{font-size:24px}
  .tshot{display:block;position:relative;margin:-2px -2px 18px;border-radius:14px;background:#0B1528;border:1px solid rgba(14,29,58,.15)}
  .tshot img{width:100%;max-height:440px;object-fit:cover;object-position:top;border-radius:13px}
  .tshot .demo-tag{position:absolute;top:10px;inset-inline-end:10px;font-size:12.5px;padding:4px 11px 4px 10px}
  .story-note{display:block;max-width:560px;margin:16px auto 0;font-size:14px;color:var(--tx2);text-align:center}
  .story-note a{color:var(--tx0);border-bottom:1px solid rgba(245,200,64,.55)}
}
@media screen and (max-width:420px){
  .dbar .wordmark{width:104px}
  .dbar .brand small{display:none}
  .dbar .demo-tag{font-size:13.5px;padding:6px 12px 6px 10px}
}
</style>
</head>

  function shCompose(s){ return s.replace(/SH✡MER/g,'<span class="sh">SH<i>✡</i>MER</span>'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  /* actions run inside the real dashboard (same origin) */
  function act(name){
    if(!W) return;
    try{
      var B=W._boardLoad&&W._boardLoad();
      if(name!=='resolve'&&W.closeEvEdit) W.closeEvEdit();
      if(name==='reset'||name==='open'||name==='map'){ if(B&&B.reviews&&B.reviews.demo0){ delete B.reviews.demo0; W._boardSave(B); W.boardRefresh(); } }
      if(name==='reset'){ W.closeResponse(); }
      if(name==='open'){ if(!W.document.getElementById('resp')) W.openResponse('demo0'); }
      if(name==='map'){ W.closeResponse(); var e=W._liveEvents.demo0&&W._liveEvents.demo0.e; if(e) W.flyToLive(+e.lat,+e.lng,'demo0'); }
      if(name==='resolve'){ if(B){ B.reviews.demo0={status:'handled',note:'שומר הגיע תוך 4 דק׳ · הדגמה',at:Date.now()}; W._boardSave(B); } W.closeResponse(); W.boardRefresh(); setTimeout(function(){ try{ W.openEvEdit('demo0'); place(); }catch(e){} },300); }
    }catch(err){ try{console.warn('tour action',name,err);}catch(e){} }
  }

  function rectOf(st){
    if(!W||!st.sel) return null;
    var d=W.document, el=d.querySelector(st.sel)||(st.alt&&d.querySelector(st.alt));
    if(!el) return null;
    var r=el.getBoundingClientRect(); if(!r.width||!r.height) return null;
    var p=st.pad||6, sw=stage.clientWidth, sh=stage.clientHeight;
    var x=Math.max(4,r.left-p), y=Math.max(4,r.top-p), w=Math.min(sw-4,r.right+p)-x, h=Math.min(sh-4,r.bottom+p)-y;
    return {x:x,y:y,w:w,h:h};
  }
  function place(){
    var st=STEPS[cur];
    if(!live) return;
    var r=ready&&rectOf(st);
    if(r){
      spot.classList.remove('full'); spot.classList.add('on');
      spot.style.left=r.x+'px'; spot.style.top=r.y+'px'; spot.style.width=r.w+'px'; spot.style.height=r.h+'px';
      card.classList.remove('center');
      /* card goes on the physical side away from the target */
      var cx=r.x+r.w/2;
      card.classList.toggle('left',cx>stage.clientWidth/2); /* target on the right half → card on the left */
    } else {
      spot.classList.add('on','full'); spot.style.left='50%'; spot.style.top='50%'; spot.style.width='0px'; spot.style.height='0px';
      card.classList.add('center'); card.classList.remove('left');
    }
  }

  function show(i){
    cur=Math.max(0,Math.min(STEPS.length-1,i));
    var st=STEPS[cur];
    $('t-kick').textContent=st.k;
    $('t-num').textContent=(cur>0&&!st.end)?('שלב '+cur+' מתוך '+(STEPS.length-2)):'';
    $('t-title').innerHTML=shCompose(esc(st.t));
    $('t-body').innerHTML=shCompose(esc(st.b)).replace('100 / 101','<bdi>100 / 101</bdi>').replace('₪2,500','<bdi>₪2,500</bdi>');
    $('t-adv').hidden=!st.a; if(st.a) $('t-adv-txt').innerHTML='<b>היתרון:</b> '+esc(st.a);
    $('t-note').hidden=!st.note; $('t-note').textContent=st.note||'';
    $('t-end').hidden=!st.end; $('t-nav').hidden=!!st.end;
    $('t-explore').hidden=!live;
    $('t-prev').disabled=cur===0;
    $('t-next').innerHTML=st.next||(cur===STEPS.length-2?'לסיום ←':'הבא ←');
    var dots=$('t-dots').children; for(var k=0;k<dots.length;k++) dots[k].classList.toggle('on',k===cur);
    $('prog').innerHTML=(cur>0&&!st.end)?('שלב <b>'+cur+'</b> מתוך '+(STEPS.length-2)):'';
    var img=$('tshot-img'); if(!live){ img.src=st.img; img.alt=st.end?'':'צילום מסך מהלוח במצב הדגמה: '+st.t; $('tshot').querySelector('.demo-tag').hidden=!!st.end; }
    if(live&&ready&&st.act) act(st.act);
    card.classList.remove('hide'); $('pill').classList.remove('on');
    place(); setTimeout(place,420); setTimeout(place,900);
    if(!done[cur]){ done[cur]=1; SC.track('demo_step',{n:cur,mode:live?'live':'story'}); }
    if(st.end) SC.track('demo_complete',{mode:live?'live':'story'});
    if(!live&&i!==0) card.scrollIntoView({block:'start',behavior:'smooth'});
  }

  $('t-next').addEventListener('click',function(){ show(cur+1); });
  $('t-prev').addEventListener('click',function(){ show(cur-1); });
  function minimize(){ card.classList.add('hide'); spot.classList.remove('on'); $('pill').classList.add('on'); SC.track('demo_explore'); }
  $('t-explore').addEventListener('click',minimize);
  $('pill-tour').addEventListener('click',function(){ show(cur===STEPS.length-1?0:cur); });
  $('pill-buy').addEventListener('click',function(){ SC.track('select_plan',{x:'demo-pill'}); location.href='../checkout/?plan=pilot'; });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){ if(!STEPS[cur].end) show(cur+1); }
    else if(e.key==='ArrowRight'){ show(cur-1); }
    else if(e.key==='Escape'&&live){ minimize(); }
  });
  window.addEventListener('resize',function(){ var l=window.matchMedia('(min-width:1100px)').matches; if(l!==live){ location.reload(); return; } place(); });

  if(live){
    frame.src='../app/dashboard.html?demo=1&tour=1';
    var t0=Date.now();
    (function poll(){
      try{ W=frame.contentWindow; if(W&&W._liveEvents&&W._liveEvents.demo0&&W.MAP&&W.document.getElementById('c-net')) ready=true; }catch(e){}
      if(ready){ try{ W._alarmMuted=true; }catch(e){} act('reset'); setTimeout(function(){ loader.classList.add('off'); show(cur); },600); follow=setInterval(place,600);
        try{ W.document.addEventListener('scroll',place,true); }catch(e){} return; }
      if(Date.now()-t0>25000){ /* dashboard did not load: fall back to the screenshot story */ loader.innerHTML='<div style="text-align:center;max-width:26em;padding:20px">הלוח לא נטען כרגע. <a class="link" href="./">נסו לרענן</a>, או <a class="link" href="../">חזרו לעמוד הראשי</a>.</div>'; return; }
      setTimeout(poll,300);
    })();
  } else {
    show(0);
  }
})();
</script>
