<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3Shamrocks Studio — How We Work</title>
<link rel="icon" href="assets/studio/3S_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#06060c;overflow:hidden;font-family:'Press Start 2P',monospace}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#171030,#06060c 75%)}
  .screen{position:relative;width:min(96vw,1000px);aspect-ratio:16/9;border-radius:16px;overflow:hidden;box-shadow:0 0 0 3px #2c2456,0 0 70px -8px #8239ea,0 30px 80px rgba(0,0,0,.6);background:#07060f}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  .crt{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);mix-blend-mode:multiply}
  .crt::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 125% 125% at 50% 50%,transparent 58%,rgba(0,0,0,.5) 100%)}
  .pad{position:absolute;z-index:6;bottom:16px;right:18px;display:flex;gap:10px}
  .pad button{font-family:inherit;font-size:11px;color:#fff;background:#8239ea;border:3px solid #fff;border-radius:7px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #43206f;transition:transform .05s,box-shadow .05s;text-transform:uppercase;letter-spacing:1px}
  .pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #43206f}
  .pad button.ghost{background:#141235;color:#b9a8ff;box-shadow:0 4px 0 #090720}
  .snd{position:absolute;z-index:6;top:14px;right:16px;font-size:9px;color:#b9a8ff;background:rgba(14,12,36,.7);border:2px solid #2c2456;border-radius:20px;padding:8px 12px;cursor:pointer}
  .snd.on{color:#6bef9a;border-color:#2a7d52}
  .hint{position:absolute;z-index:6;left:18px;bottom:18px;font-size:8px;color:rgba(255,255,255,.38);line-height:1.9}
  @media(max-width:600px){.pad button{font-size:10px;padding:11px 12px}.hint{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="screen">
    <canvas id="game" width="384" height="216"></canvas>
    <div class="crt"></div>
    <button class="snd" id="snd">♪ SOUND</button>
    <div class="pad" id="pad"></div>
    <div class="hint">← → / SPACE to move<br>ENTER to start</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script>
const cv=document.getElementById('game'), x=cv.getContext('2d'); x.imageSmoothingEnabled=false;
const W=384,H=216, GY=176; // ground y
const P={ win1:'#3a2a63',win2:'#241a46', floor:'#241a42',floor2:'#1a1232', wall1:'#2a1e50',wall2:'#1c1540',
  white:'#f6f2ff', green:'#3dcc6e',green2:'#7bf0a4', gold:'#ffd05c',gold2:'#a9741a', purple:'#8239ea',purple2:'#c0a0ff',
  cyan:'#63d4e0', red:'#ff6a86', sky:'#3a2a63', star:'#cdbcff',
  cap:'#1f2140',capHi:'#3a3d66',capBill:'#14152b', skin:'#eab78b',skinS:'#c98f63',skinH:'#f8d4ac',
  beard:'#6a4a30',beardD:'#4a3220', navy:'#163a6e',navyS:'#0f2a52', jean:'#2a3f66',jeanD:'#1b2b47', shoe:'#eef0ff',sole:'#a6a8c4', arm:'#e3aa7e' };

function px(c,a,b,w,h){ x.fillStyle=c; x.fillRect(a|0,b|0,w|0,h|0); }
const FONT=(s)=>x.font=(8*s)+"px 'Press Start 2P'";
function text(t,a,b,c,s){ FONT(s); x.fillStyle=c; x.textBaseline='top'; x.fillText(t,a,b); }
function ctext(t,b,c,s){ FONT(s); const w=x.measureText(t).width; text(t,(W-w)/2,b,c,s); }
function wrap(str,b,c,maxw,lh,s){ FONT(s); const words=str.split(' '); let line='',y=b; for(const w of words){const t=line?line+' '+w:w; if(x.measureText(t).width>maxw){ctext(line,y,c,s);line=w;y+=lh;}else line=t;} if(line)ctext(line,y,c,s); return y; }

/* ---------- DAVE (detailed, 2 walk frames) ---------- */
function dave(cx,gy,frame,face){
 x.save();
 if(face<0){ x.translate(cx*2,0); x.scale(-1,1); cx=cx; } // mirror around cx
 const X=cx-9; // sprite ~18 wide
 const bob = frame===2 ? -1 : 0;
 const y=gy-30+bob;
 // shadow
 px('rgba(0,0,0,.28)', cx-9, gy-1, 18, 3);
 // legs (jeans) + walk
 if(frame===1){ px(P.jean,X+4,y+22,4,7); px(P.jeanD,X+4,y+26,4,3); px(P.jean,X+11,y+22,4,6); px(P.shoe,X+3,y+28,6,2); px(P.shoe,X+11,y+27,6,2); }
 else if(frame===2){ px(P.jean,X+5,y+22,4,6); px(P.jean,X+10,y+22,4,7); px(P.jeanD,X+10,y+26,4,3); px(P.shoe,X+4,y+27,6,2); px(P.shoe,X+10,y+28,6,2); }
 else { px(P.jean,X+5,y+22,4,7); px(P.jean,X+10,y+22,4,7); px(P.jeanD,X+5,y+26,4,3); px(P.jeanD,X+10,y+26,4,3); px(P.shoe,X+4,y+28,5,2); px(P.shoe,X+10,y+28,5,2); px(P.sole,X+4,y+29,5,1); px(P.sole,X+10,y+29,5,1); }
 // torso (navy tee)
 px(P.navy,X+4,y+13,11,10); px(P.navyS,X+4,y+20,11,3); px(P.navyS,X+4,y+13,2,10);
 // shamrock logo (green) on chest
 px(P.green,X+8,y+15,2,2); px(P.green,X+7,y+16,4,1); px(P.green,X+8,y+17,2,2); px(P.green2,X+8,y+15,1,1);
 // arms
 if(frame===1){ px(P.navy,X+1,y+13,3,6); px(P.arm,X+1,y+18,3,3); px(P.navy,X+15,y+14,3,5); px(P.arm,X+15,y+18,3,3); }
 else if(frame===2){ px(P.navy,X+1,y+14,3,5); px(P.arm,X+1,y+18,3,3); px(P.navy,X+15,y+13,3,6); px(P.arm,X+15,y+18,3,3); }
 else { px(P.navy,X+1,y+13,3,6); px(P.arm,X+1,y+18,3,3); px(P.navy,X+15,y+13,3,6); px(P.arm,X+15,y+18,3,3); }
 // neck
 px(P.skinS,X+8,y+11,3,2);
 // head (skin)
 px(P.skin,X+5,y+3,9,9); px(P.skinH,X+6,y+4,2,2); px(P.skinS,X+5,y+10,9,2);
 // beard
 px(P.beard,X+5,y+8,9,4); px(P.beardD,X+5,y+11,9,1); px(P.beard,X+4,y+7,2,3); px(P.beard,X+13,y+7,2,3);
 // eyes
 px(P.white,X+6,y+6,2,2); px(P.white,X+11,y+6,2,2); px('#1a1420',X+7,y+6,1,2); px('#1a1420',X+12,y+6,1,2);
 // cap (backwards): dome + small bill at back
 px(P.cap,X+4,y+0,11,4); px(P.cap,X+4,y+2,11,2); px(P.capHi,X+5,y+0,6,1); px(P.capBill,X+13,y+3,3,2);
 x.restore();
}

/* ---------- station scenes ---------- */
function station(i,cx,lit,t){
 const base=GY, ac=[P.gold,P.cyan,P.purple2,P.green2][i];
 // platform
 px(lit?ac:'#2c2650', cx-20, base-2, 40, 3); px(P.floor2,cx-20,base+1,40,2);
 x.globalAlpha=lit?1:0.45;
 if(i===0){ // IDEA: desk + lamp + bulb glow
   px('#3a2c18',cx-16,base-10,32,8); px('#2a2012',cx-16,base-4,32,4);
   // papers
   px('#e8e2d0',cx-13,base-13,7,5); px('#c8c0a8',cx-13,base-9,7,1); px('#e8e2d0',cx-4,base-12,6,4);
   // lamp
   px('#555',cx+9,base-10,2,8); px('#777',cx+6,base-15,8,3);
   // bulb glow
   if(lit){ px('rgba(255,208,92,.25)',cx-20,base-26,20,16); } px(P.gold,cx-12,base-22,6,6); px('#fff6c8',cx-11,base-21,2,2); px('#8a6b14',cx-11,base-16,4,2);
 } else if(i===1){ // DESIGN: monitor w/ UI + palette
   px('#1a1a2c',cx-12,base-22,24,16); px(lit?'#2a3f8a':'#20233a',cx-10,base-20,20,12);
   px(P.cyan,cx-8,base-18,8,2); px(P.purple2,cx-8,base-14,5,2); px(P.green2,cx-2,base-14,6,5); px('#555',cx-3,base-6,6,4);
   // palette
   px('#3a2c18',cx-14,base-5,8,4); px(P.red,cx-13,base-4,2,2); px(P.cyan,cx-10,base-4,2,2); px(P.gold,cx-7,base-4,2,2);
 } else if(i===2){ // BUILD: desktop + code + blocks
   px('#20243a',cx-13,base-20,18,14); px(lit?'#0f1a10':'#10131f',cx-11,base-18,14,10);
   for(let r=0;r<4;r++){ px([P.green2,P.cyan,P.purple2,P.gold][r],cx-9,base-16+r*2,4+((r*3)%7),1); }
   // blocks
   px(P.green,cx+6,base-8,4,4); px(P.purple2,cx+10,base-8,4,4); px(P.red,cx+6,base-4,4,4); px(P.gold,cx+10,base-4,4,4);
 } else { // SHIP: launchpad + rocket + flag
   px('#2a2444',cx-10,base-6,20,4);
   const o = lit ? -(Math.abs(Math.sin(t/20))*6)|0 : 0;
   px(P.white,cx-3,base-22+o,6,14); px(P.green2,cx-3,base-22+o,6,4); px('#c0c0d8',cx-3,base-14+o,6,2);
   px(P.red,cx-6,base-12+o,3,4); px(P.red,cx+3,base-12+o,3,4); px(P.cyan,cx-1,base-18+o,2,2);
   if(lit){ px(P.gold,cx-2,base-8+o,4,4+((t/4|0)%4)); px(P.red,cx-1,base-6+o,2,5+((t/3|0)%4)); }
   // flag
   px('#777',cx+10,base-16,1,10); px(P.purple,cx+11,base-16,5,4);
 }
 x.globalAlpha=1;
 text((i+1)+'', cx-3, base+6, lit?ac:'#4a4470', 0.9);
}

/* ---------- background ---------- */
let starfield=[]; for(let i=0;i<40;i++)starfield.push({x:Math.random()*W,y:Math.random()*120,p:Math.random()*6.28});
function bg(t){
 const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,P.wall1); g.addColorStop(1,P.wall2); x.fillStyle=g; x.fillRect(0,0,W,H);
 // big studio windows w/ city skyline + stars
 for(let w=0; w<3; w++){ const wx=20+w*130; px('#120c28',wx-3,20,113,78); px(P.win2,wx,24,107,70);
   // skyline
   for(let b=0;b<9;b++){ const bh=14+((b*13+w*7)%40); px('#1a1440',wx+6+b*12,94-bh,9,bh); for(let k=4;k<bh;k+=6)px('rgba(255,208,92,.15)',wx+8+b*12,96-k,2,2); }
   // stars
   starfield.forEach(s=>{ if(s.x>wx&&s.x<wx+107&&s.y>24&&s.y<70){ const a=0.3+0.5*Math.abs(Math.sin(t/30+s.p)); px('rgba(205,188,255,'+a+')',s.x|0,s.y|0,1,1); } });
   px('#2c2456',wx,24,107,2); px('#2c2456',wx+52,24,2,70);
 }
 // hanging shamrock plant
 px('#2a7d52',40,6,2,16); px(P.green,34,16,14,8); px(P.green2,36,17,5,3); px(P.green,37,22,8,4);
 // framed product posters on wall
 ['#ff6a86','#63d4e0','#ffd05c'].forEach((c,i)=>{ const fx=238+i*40; px('#0e0a22',fx,40,30,22); px(c,fx+2,42,26,18); px('rgba(255,255,255,.2)',fx+2,42,26,5); });
 // floor
 px(P.floor,0,GY,W,H-GY); for(let i=0;i<W;i+=18){px(P.floor2,i,GY,1,H-GY);} px('rgba(255,255,255,.05)',0,GY,W,2);
 // rug
 px('rgba(130,57,234,.16)',60,GY+14,260,16);
}

/* ---------- state ---------- */
const STG=[
 {n:'IDEA',  d:'Find the real problem worth solving.'},
 {n:'DESIGN',d:'Shape the brand, the look, the feel.'},
 {n:'BUILD', d:'Turn the design into a working app.'},
 {n:'SHIP',  d:'Launch it, polish it, level it up.'}];
const SX=[70,162,254,330];
const AC=[P.gold,P.cyan,P.purple2,P.green2];
let state='title', stage=0, dpos=SX[0], tgt=SX[0], face=1, t=0, blink=0, conf=[], shake=0;

/* ---------- audio (Tone): soft, warm, consonant ---------- */
let AU=null, muted=false;
function audioInit(){
 if(AU||typeof Tone==='undefined') return;
 const reverb=new Tone.Reverb({decay:4.5,wet:0.34}).toDestination();
 const master=new Tone.Volume(-11).connect(reverb);
 const pad=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:1.3,decay:0.4,sustain:0.62,release:2.6},volume:-11}).connect(master);
 const bell=new Tone.FMSynth({harmonicity:2,modulationIndex:1.4,envelope:{attack:0.01,decay:0.9,sustain:0,release:0.9},volume:-15}).connect(new Tone.FeedbackDelay('4n.',0.28).connect(reverb));
 const bass=new Tone.Synth({oscillator:{type:'sine'},envelope:{attack:0.12,decay:0.3,sustain:0.6,release:0.9},volume:-12}).connect(master);
 const chords=[['C4','E4','G4','B4'],['F3','A3','C4','E4'],['A3','C4','E4','G4'],['G3','B3','D4','F4']];
 const roots=['C2','F2','A1','G2'], pent=['C5','D5','E5','G5','A5','C6'];
 let bar=0, cur=chords[0];
 Tone.Transport.bpm.value=64;
 new Tone.Loop(t=>{ cur=chords[bar%4]; pad.triggerAttackRelease(cur,'1m',t); bass.triggerAttackRelease(roots[bar%4],'2n',t); bar++; },'1m').start(0);
 new Tone.Loop(t=>{ if(Math.random()<0.55) bell.triggerAttackRelease(pent[Math.floor(Math.random()*pent.length)],'8n',t,0.6); },'2n').start('0:1');
 Tone.Transport.start();
 AU={bell,master};
}
function ding(i){ if(AU&&!muted){try{AU.bell.triggerAttackRelease(['E5','G5','A5','C6','E6'][i%5],'8n',undefined,0.8);}catch(e){}} }

/* ---------- actions ---------- */
async function start(){ if(typeof Tone!=='undefined'){try{await Tone.start();}catch(e){}} audioInit(); }
function advance(){
 if(state==='title'){ start(); state='play'; stage=0; dpos=tgt=SX[0]; ding(0); return; }
 if(state==='win'){ state='play'; stage=0; dpos=tgt=SX[0]; return; }
 if(stage<STG.length-1){ stage++; tgt=SX[stage]; face=1; ding(stage); if(stage===2)shake=6; }
 else { state='win'; shake=8; for(let i=0;i<60;i++)conf.push({x:Math.random()*W,y:40+Math.random()*60,vy:-(0.3+Math.random()*1.1),vx:(Math.random()-.5),c:[P.gold,P.green2,P.purple2,P.cyan,P.white][i%5],l:70+Math.random()*50}); for(let k=0;k<5;k++)setTimeout(()=>ding(k),k*120); }
}
function back(){ if(state==='play'&&stage>0){ stage--; tgt=SX[stage]; face=-1; } }

/* ---------- render ---------- */
function render(){
 t++; x.save();
 if(shake>0){ x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=0.85; if(shake<0.4)shake=0; }
 x.clearRect(-10,-10,W+20,H+20); bg(t);
 // stations always shown
 STG.forEach((s,i)=> station(i,SX[i], (state!=='title')&&(i<=stage||state==='win'), t));

 if(state==='title'){
   dave(W/2, GY, (t/14|0)%2? 0:0, 1); // idle
   // idle breathe handled by frame 0 only; add gentle bob
   ctext('3SHAMROCKS',40,P.green2,2.0); ctext('STUDIO',66,P.white,1.3); ctext('HOW WE WORK',90,P.purple2,0.85);
   blink=(blink+1)%64; if(blink<42) ctext('▶ PRESS START',150,P.gold,1.05);
 } else if(state==='play'){
   // move dave
   const moving=Math.abs(dpos-tgt)>1.2; if(moving) dpos+=Math.sign(tgt-dpos)*1.8;
   const fr = moving ? (1+((t/6|0)%2)) : 0;
   dave(Math.round(dpos), GY, fr, face);
   // caption panel
   const ac=AC[stage];
   px('rgba(8,7,20,.85)',14,10,W-28,42); px(ac,14,10,W-28,2); px(ac,14,50,W-28,2);
   text('STAGE '+(stage+1)+'/4',20,16,'rgba(255,255,255,.5)',0.75);
   text(STG[stage].n,20,28,ac,1.15);
   FONT(1); x.fillStyle=P.white; wrap(STG[stage].d,16,P.white,180,11,1); // right side text, centered-ish
   // (draw desc on right)
   px('rgba(0,0,0,0)',0,0,0,0);
   // XP bar
   text('STUDIO XP',18,GY+26,'rgba(255,255,255,.4)',0.7);
   px('rgba(255,255,255,.14)',18,GY+36,W-36,6); px(P.green,18,GY+36,(W-36)*(stage/(STG.length-1)),6); px(P.green2,18,GY+36,(W-36)*(stage/(STG.length-1)),2);
 } else {
   conf.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.l--;px(p.c,p.x|0,p.y|0,2,2);}); conf=conf.filter(p=>p.l>0);
   dave(W/2, GY, 0, 1);
   ctext('LEVEL CLEAR ★',40,P.gold,1.5);
   wrap('Idea to shipped product. That is how 3Shamrocks works.',72,P.white,250,12,1);
   blink=(blink+1)%64; if(blink<42) ctext('▶ PLAY AGAIN',150,P.green2,0.95);
 }
 x.restore();
 requestAnimationFrame(render);
}

/* caption desc is drawn centered on the right of the panel */
const _wrap=wrap;
/* ---------- input ---------- */
cv.addEventListener('click',advance);
addEventListener('keydown',e=>{ if(['Enter',' ','ArrowRight'].includes(e.key)){e.preventDefault();advance();} else if(e.key==='ArrowLeft'){e.preventDefault();back();} });
const pad=document.getElementById('pad');
function btn(l,fn,g){const b=document.createElement('button');b.textContent=l;if(g)b.className='ghost';b.onclick=fn;return b;}
pad.appendChild(btn('◀',back,true)); pad.appendChild(btn('NEXT ▶',advance));
const sb=document.getElementById('snd');
sb.onclick=()=>{ muted=!muted; if(typeof Tone!=='undefined'){ Tone.Destination.mute=muted; } sb.classList.toggle('on',!muted); sb.textContent=muted?'♪ MUTED':'♪ SOUND'; if(!AU&&!muted)start(); };

let go=false; function boot(){ if(go)return; go=true; render(); }
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot);
setTimeout(boot,500);
</script>
</body>
</html>
