<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbf7ef">
<title>Contact — 3Shamrocks Studio</title>
<meta name="description" content="Let's work together. markodave@gmail.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#fbf7ef;color:#23170a;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.w{max-width:1200px;margin:0 auto;padding:0 clamp(20px,4vw,56px)}
nav{position:fixed;inset-inline:0;top:0;z-index:100;height:56px;background:rgba(251,247,239,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(35,23,10,.1);display:flex;align-items:center}
.nav-in{display:flex;align-items:center;justify-content:space-between;width:100%;height:100%}
.nav-logo img{height:26px;filter:brightness(0);opacity:.9}
.nav-links{display:flex;align-items:center;gap:clamp(16px,3vw,36px)}
.nav-links a{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;color:rgba(35,23,10,.55);transition:color .18s}
.nav-links a:hover{color:#23170a}
.nav-cta{height:36px;padding:0 18px;background:linear-gradient(120deg,#E0A828,#C09020 55%,#9c7619);color:#23170a;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:999px;display:flex;align-items:center}
main{padding-top:56px;flex:1;display:flex;align-items:center}
.hero{padding:clamp(72px,9vw,120px) 0;width:100%}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(48px,9vw,128px);line-height:.9;letter-spacing:-.04em;color:#23170a;margin-bottom:clamp(24px,3vw,48px)}
h1 .g{background:linear-gradient(120deg,#E0A828,#C09020);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.contact-row{display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,32px);align-items:center;margin-bottom:clamp(48px,6vw,80px)}
.email{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:clamp(18px,2.5vw,28px);color:#23170a;border-bottom:1px solid rgba(35,23,10,.2);padding-bottom:2px;transition:color .18s,border-color .18s}
.email:hover{color:#C09020;border-color:rgba(192,144,32,.4)}
.li-link{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(35,23,10,.35);transition:color .18s}
.li-link:hover{color:#23170a}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(35,23,10,.1);max-width:720px}
.info-cell{background:#ffffff;padding:clamp(16px,2vw,24px)}
.info-l{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(35,23,10,.28);margin-bottom:6px}
.info-v{font-size:14px;font-weight:400;color:rgba(35,23,10,.7)}
footer{padding:clamp(24px,3vw,36px) 0;border-top:1px solid rgba(35,23,10,.1)}
.footer-in{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.footer-logo img{height:20px;filter:brightness(0);opacity:.3}
.footer-links{display:flex;gap:24px}
.footer-links a{font-size:11px;color:rgba(35,23,10,.28);transition:color .15s}
.footer-links a:hover{color:#23170a}
.footer-copy{font-size:11px;color:rgba(35,23,10,.2)}
@media(max-width:768px){.info{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><div class="w nav-in">
  <a href="/" class="nav-logo"><img src="https://raw.githubusercontent.com/3ShamrocksStudio/3shamrocksstudio.github.io/main/assets/studio/3shamrocks.png" alt="3Shamrocks Studio"></a>
  <div class="nav-links">
    <a href="/works/">Works</a><a href="/about/">About</a><a href="/capabilities/">Capabilities</a>
    <a href="mailto:markodave@gmail.com" class="nav-cta">Let's talk</a>
  </div>
</div></nav>
<main><section class="hero"><div class="w">
  <h1>Let's work<br><span class="g">together.</span></h1>
  <div class="contact-row">
    <a class="email" href="mailto:markodave@gmail.com">markodave@gmail.com</a>
    <a class="li-link" href="https://www.linkedin.com/in/davemarkovich" target="_blank" rel="noopener">LinkedIn ↗</a>
  </div>
  <div class="info">
    <div class="info-cell"><div class="info-l">Location</div><div class="info-v">Tel Aviv, Israel</div></div>
    <div class="info-cell"><div class="info-l">Availability</div><div class="info-v">Open to projects</div></div>
    <div class="info-cell"><div class="info-l">Response time</div><div class="info-v">Within 24 hours</div></div>
  </div>
</div></section></main>
<footer><div class="w"><div class="footer-in">
  <div class="footer-logo"><img src="https://raw.githubusercontent.com/3ShamrocksStudio/3shamrocksstudio.github.io/main/assets/studio/3shamrocks.png" alt="3Shamrocks Studio"></div>
  <div class="footer-links"><a href="/">Home</a><a href="/works/">Works</a><a href="/about/">About</a><a href="/capabilities/">Capabilities</a></div>
  <div class="footer-copy">© 2026 3Shamrocks Studio LLC</div>
</div></div></footer>
</body>
</html>
