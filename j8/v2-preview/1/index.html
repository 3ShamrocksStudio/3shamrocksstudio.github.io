<style>
:root{--g:#E8EAEC;--p:#F6F7F8;--ink:#0B0F14;--ink2:#3B444E;--mut:#5E6873;--hl:#C5CAD0;--mag:#C2188B;--run:#0090B0;--need:#E89A00;--needInk:#8A5A00;--blk:#D6232A;--ok:#1F8F3A;
--f:"B612","IBM Plex Sans Hebrew","Heebo",system-ui,sans-serif;--m:"B612","IBM Plex Sans Hebrew",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#0E1216;--p:#151A20;--ink:#E6EAEE;--ink2:#BAC2CB;--mut:#8D97A2;--hl:#2A323B;--mag:#E055B5;--run:#2BB8D6;--need:#F2AA1C;--needInk:#F2AA1C;--blk:#F0484E;--ok:#3DB35A;color-scheme:dark}}
:root[data-theme="dark"]{--g:#0E1216;--p:#151A20;--ink:#E6EAEE;--ink2:#BAC2CB;--mut:#8D97A2;--hl:#2A323B;--mag:#E055B5;--run:#2BB8D6;--need:#F2AA1C;--needInk:#F2AA1C;--blk:#F0484E;--ok:#3DB35A;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--g);color:var(--ink);font:15px/1.45 var(--f);overflow-x:hidden}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* splash: the route draws, the mark snaps onto it */
#splash{position:fixed;inset:0;z-index:99;background:var(--g);display:grid;place-items:center;transition:opacity .12s linear}
#splash.out{opacity:0;pointer-events:none}
.sp{width:min(78vw,520px);display:grid;justify-items:center;gap:18px}
.sp .mk{height:76px;opacity:0}
.sp .ln{width:100%;height:3px;background:var(--mag);transform:scaleX(0);transform-origin:0 50%}
.sp .wm{height:26px;opacity:0}
.sp p{margin:0;font:12px var(--m);color:var(--mut);opacity:0;letter-spacing:.04em}
#splash.play .ln{animation:draw .7s cubic-bezier(.3,0,.2,1) forwards}
#splash.play .mk{animation:snap .12s linear .72s forwards}
#splash.play .wm{animation:snap .12s linear .9s forwards}
#splash.play p{animation:snap .12s linear 1.05s forwards}
@keyframes draw{to{transform:scaleX(1)}}@keyframes snap{to{opacity:1}}
/* shell */
.app{max-width:1180px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:1px solid var(--hl);margin-bottom:14px}
.top img{height:22px;display:block}
.top .snap{font:11px/1.3 var(--m);color:var(--ink2);text-align:end}
.top .snap b{display:block;color:var(--mag);font-weight:700}
#view.enter{animation:snap .12s linear both;opacity:0}
.lbl{font:700 12px/1.2 var(--f);color:var(--mut);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ttl{font:700 24px/1.2 var(--f);margin:4px 0 4px}
.sub{color:var(--ink2);margin:0 0 14px}
.panel{background:var(--p);border:1px solid var(--hl);border-radius:3px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:0}
/* pace */
.big{font-size:34px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}.big span{font-size:15px;color:var(--mut);font-weight:400}
.route{position:relative;margin:30px 0 6px;height:64px}
.route svg{position:absolute;inset:16px 0 0;width:100%;height:48px;overflow:visible}
.route .rl{stroke:var(--mag);stroke-width:3}.route .tk{stroke:var(--hl);stroke-width:2}.route .end{stroke:var(--ink);stroke-width:3}
.route .gap{fill:var(--need);opacity:.55}
.here,.ghost{position:absolute;top:0;margin-inline-start:-6px;display:grid;justify-items:start;gap:2px}
.here img{display:block;height:24px;width:auto}
.here b,.ghost b{font:700 10px var(--m);white-space:nowrap}
.here img{margin-inline-start:1px}.here b{position:absolute;top:-16px;inset-inline-start:16px;color:var(--ink)}
.ghost{top:28px}.ghost i{width:12px;height:12px;border:2px dashed var(--ink2);transform:rotate(45deg);display:block}
.ghost b{color:var(--needInk);position:absolute;top:18px;inset-inline-start:0}
.route figcaption{position:absolute;top:70px;inset-inline:0;display:flex;justify-content:space-between;font:11px var(--m);color:var(--mut)}
.read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:34px 0 8px}
.read div,.cnt div{border-top:1px solid var(--hl);padding-top:6px}
.read dt,.cnt dt{font-size:11px;color:var(--mut)}.read dd,.cnt dd{margin:0;font-size:18px;font-weight:700}
.neg{color:var(--needInk)}
.note{font-size:12px;color:var(--mut);margin:4px 0 0}
/* the one move */
.call{border-inline-start:4px solid var(--need)}
.mv{font:700 20px/1.25 var(--f);margin:0 0 6px}
.call p{margin:0 0 14px;color:var(--ink2)}
/* buttons: firm 80ms press-down */
.b{min-height:46px;padding:0 18px;border-radius:3px;border:1.5px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;transition:transform .08s linear,background .12s linear}
.b.is-press,.cons.is-press,a.is-press{transform:translateY(1px) scale(.985)}
.primary{width:100%;background:var(--ink);color:var(--g);border-color:var(--ink);font-size:16px}
.primary.started{background:transparent;color:var(--ink);border-style:dashed}
.go{background:var(--ink);color:var(--g)}.nogo{background:transparent}
.b:disabled{opacity:.45;cursor:default}
.lnk{background:none;border:0;color:var(--mag);font:700 12px var(--m);text-decoration:underline;cursor:pointer;min-height:32px}
/* state shapes: never colour alone */
.sh{flex:none;width:16px;height:16px;display:inline-grid;place-items:center}
.sh-need{background:var(--need);transform:rotate(45deg) scale(.78)}
.sh-block{background:var(--blk)}
.sh-done{background:var(--ok);border-radius:50%}.sh-done svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.2}
.sh-wait{border:2px solid var(--mut);border-radius:50%}
.sh-paused{border-inline:4px solid var(--need);width:12px}
.sh-run{border:2px solid var(--run);border-radius:2px;overflow:hidden;position:relative}
.sh-run i{position:absolute;inset:0 auto 0 0;width:3px;background:var(--run);animation:tick 1.4s steps(5) infinite}
@keyframes tick{to{transform:translateX(12px)}}
.ann{font:700 11px var(--m);padding:3px 6px;border-radius:2px;border:1.5px solid currentColor;white-space:nowrap}
.ann em{font-style:normal;font-weight:400;opacity:.8}
.ann-run{color:var(--run)}.ann-need{color:var(--needInk)}.ann-block{color:var(--blk)}.ann-done{color:var(--ok)}.ann-wait{color:var(--mut)}.ann-paused{color:var(--needInk)}
/* consoles */
.conslist{display:grid;gap:0;border-top:1px solid var(--hl)}
.cons{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 4px;border-bottom:1px solid var(--hl);text-decoration:none;transition:background .12s linear,transform .08s linear}
.cons:hover{background:color-mix(in srgb,var(--mag) 5%,transparent)}
.cn{flex:1;min-width:0;display:grid}.cn b{font-size:15px}.cn small{color:var(--mut);font-size:12.5px}
.conslist.tall .cons{min-height:78px}
.prog{height:3px;background:var(--hl);margin-top:6px}.prog i{display:block;height:100%;background:var(--mag)}
.cnt{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 0}
/* foot + stop */
.foot{margin:8px 0 12px;padding:12px 0;border-top:1px solid var(--hl)}
.foot>p{font-size:12px;color:var(--mut);margin:0 0 10px}
.stop{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stop p{margin:0;font-size:13px;color:var(--ink2);flex:1 1 220px}
.stopb{border-color:var(--blk);color:var(--blk)}.stopb.on{background:var(--blk);color:#fff}
/* gates */
.polls{display:grid;gap:12px}
.poll{background:var(--p);border:1px solid var(--hl);border-inline-start:4px solid var(--need);border-radius:3px;padding:14px 16px;animation:snap .12s linear both}
.poll.done-go,.poll.done-done{border-inline-start-color:var(--run)}.poll.done-nogo{border-inline-start-color:var(--mut)}
.ph{display:flex;align-items:center;gap:10px}.ph h3{margin:0;font-size:16px;flex:1}.min{font-size:12px;color:var(--mut)}
.poll p{margin:8px 0}.mtag{font-size:11px;color:var(--mag)}
.ev{margin:0 0 8px;padding:0;list-style:none;font:12px var(--m);color:var(--ink2)}.ev li::before{content:"› ";color:var(--mag)}
.rec{font-size:12px;color:var(--ink2)}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns .b{flex:1 1 90px}
/* mission */
.back{display:inline-block;min-height:44px;line-height:44px;text-decoration:none;font-weight:700;color:var(--mag)}
.mh{margin-bottom:12px}.mh .ann{display:inline-block;margin:4px 0 8px}
.wp{list-style:none;margin:0;padding:0;position:relative}
.wp::before{content:"";position:absolute;inset-inline-start:7px;top:10px;bottom:10px;width:2px;background:var(--mag)}
.wp li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative}
.wp li .sh{margin-top:2px;outline:3px solid var(--p)}
.wp b{display:block;font-size:14.5px}.wp small{color:var(--mut);font-size:12.5px}
.log,.proofs{list-style:none;margin:0 0 14px;padding:0}
.log li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--hl);font-size:13.5px}
.log time{color:var(--mag);font-size:12px}
.proofs li{padding:6px 0;font-size:13.5px}.proofs .k{display:inline-block;min-width:54px;color:var(--run);font-size:11px;font-weight:700}
/* proof */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:40px;padding:0 12px;border:1.5px solid var(--hl);background:var(--p);border-radius:3px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--mag);color:var(--mag);font-weight:700}
.flog{list-style:none;margin:0;padding:0;border-top:1px solid var(--hl)}
.flog li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--hl)}
.flog time{font-size:11.5px;color:var(--mut)}.flog b{display:block;font-size:14px}.flog small{color:var(--mut);font-size:12px}
.flog .k-miss b{color:var(--blk)}.flog .k-miss b::before{content:"■ ";font-size:10px}
.flog .k-cash b::before{content:"◆ ";color:var(--ok);font-size:11px}
/* talk */
.thread{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.thread li{background:var(--p);border:1px solid var(--hl);border-inline-start:3px solid var(--mag);border-radius:3px;padding:10px 12px}
.thread time{font-size:11px;color:var(--mut)}.thread p{margin:4px 0 0}
.say{display:grid;grid-template-columns:1fr auto;gap:8px}.say label{grid-column:1/-1;margin:0}
.say input{min-height:46px;border:1.5px solid var(--hl);border-radius:3px;background:var(--p);padding:0 12px;font:inherit;color:var(--ink);min-width:0}
/* nav: bottom bar on phone */
#nav{position:fixed;inset:auto 0 0;z-index:20;display:flex;background:var(--p);border-top:1px solid var(--hl);padding-bottom:env(safe-area-inset-bottom)}
#nav a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 0 9px;text-decoration:none;font-size:11px;color:var(--mut);position:relative;min-height:56px}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
#nav a[aria-current]{color:var(--ink);font-weight:700}
#nav a[aria-current]::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;background:var(--mag)}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);font:700 10px/16px var(--m);min-width:18px;padding:0 4px;background:var(--need);color:#000;border-radius:2px;text-align:center;font-style:normal}
#hud{position:fixed;z-index:60;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--ink);color:var(--g);border-radius:3px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:13px var(--m);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .12s linear,transform .12s linear}
#hud.on{opacity:1;transform:none;pointer-events:auto}
#hud button{background:none;border:1.5px solid var(--g);color:var(--g);border-radius:3px;min-height:36px;padding:0 10px;font:700 12px var(--m);cursor:pointer}
@media (min-width:960px){
  .app{padding:0 32px 40px 112px}
  #nav{inset:0 auto 0 0;width:88px;flex-direction:column;justify-content:flex-start;padding-top:80px;border-top:0;border-inline-end:1px solid var(--hl)}
  #nav a{flex:none;min-height:72px}
  #nav a[aria-current]::before{inset:14px auto 14px 0;width:3px;height:auto}
  .grid{grid-template-columns:1.15fr 1fr;column-gap:14px;align-items:start}
  .grid>.pace{grid-row:span 2}
  .grid.two{grid-template-columns:1fr 1fr}
  .polls{grid-template-columns:1fr 1fr}
  #hud{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

</style>
</head>

DATA.pace = Math.round(DATA.goal * DATA.elapsed / DATA.spanDays); // straight-line target for today
DATA.delta = DATA.booked - DATA.pace;
DATA.perDay = Math.round((DATA.goal - DATA.booked) / DATA.daysLeft);

var STATE_WORD = { run: 'Running', need: 'Needs you', block: 'Blocked', done: 'Done', wait: 'Waiting', paused: 'Paused' };
var S = { decide: {}, stopped: false, moveStarted: false, prevMission: {} };

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

}
function ils(n) { var s = Math.abs(Math.round(n)).toLocaleString('en-US'); return (n < 0 ? '−' : '') + '₪' + s; }
function mission(id) { for (var i = 0; i < DATA.missions.length; i++) if (DATA.missions[i].id === id) return DATA.missions[i]; return null; }
function gate(id) { for (var i = 0; i < DATA.gates.length; i++) if (DATA.gates[i].id === id) return DATA.gates[i]; return null; }
/* Preview state: a "Go" on a mission's gate moves it to running, a No-go keeps it waiting. Labelled preview everywhere. */
function mstate(m) {
  if (S.stopped) return 'paused';

}
function isPreviewState(m) { return S.stopped || !!(m.gate && S.decide[m.gate]); }

var VIEW = null; // set by each direction
var view, hudEl, hudTimer, lastUndo;

function hud(msg, undoFn) {
  if (!hudEl) return;
  lastUndo = undoFn || null;
  hudEl.innerHTML = '<span>' + esc(msg) + '</span>' + (undoFn ? '<button type="button" data-act="undo">Undo</button>' : '');
  hudEl.classList.remove('on'); void hudEl.offsetWidth; hudEl.classList.add('on');
  clearTimeout(hudTimer);
  hudTimer = setTimeout(function () { hudEl.classList.remove('on'); lastUndo = null; }, 5000);
}
function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* no haptics */ } }

function parseHash() {
  var h = (location.hash || '').replace(/^#/, '');
  var parts = h.split('/');
  var scr = parts[0] || 'now';
  if (scr === 'm' && mission(parts[1])) return { scr: 'mission', id: parts[1] };
  if (['now', 'missions', 'gates', 'proof', 'talk'].indexOf(scr) < 0) scr = 'now';
  return { scr: scr };
}
var current = null;
function render(keepScroll) {
  var r = parseHash();
  var html = r.scr === 'mission' ? VIEW.mission(mission(r.id)) : VIEW[r.scr]();
  var changed = !current || current.scr !== r.scr || current.id !== r.id;
  view.innerHTML = html;
  document.getElementById('nav').innerHTML = VIEW.nav(r.scr === 'mission' ? 'missions' : r.scr);
  if (changed) {
    view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter');
    if (!keepScroll) window.scrollTo(0, 0);
    var h = view.querySelector('h1,h2');
    if (h && current) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  current = r;
  if (VIEW.after) VIEW.after(r);
}

function act(a, id, el) {
  buzz();
  if (a === 'undo') { if (lastUndo) { var f = lastUndo; lastUndo = null; f(); hudEl.classList.remove('on'); } return; }
  if (a === 'stop') {
    S.stopped = !S.stopped;
    render(true);
    hud(S.stopped ? 'Stop all · preview only, nothing was changed' : 'Resumed · preview only', function () { S.stopped = !S.stopped; render(true); });
    return;
  }
  if (a === 'move') {
    S.moveStarted = !S.moveStarted;
    render(true);
    if (S.moveStarted) hud('Started · preview only, the real steps open in the app', function () { S.moveStarted = false; render(true); });
    return;
  }
  if (['go', 'nogo', 'done', 'later', 'hold', 'sent'].indexOf(a) >= 0 && gate(id)) {
    var g = gate(id); var v = a === 'hold' || a === 'later' ? 'nogo' : a === 'sent' ? 'done' : a;
    S.decide[id] = v;
    render(true);
    var word = { go: 'Go', nogo: a === 'hold' ? 'Held' : a === 'later' ? 'Not now' : 'No-go', done: a === 'sent' ? 'Marked sent' : 'Done' }[v];
    hud(word + ': ' + g.title + ' · preview, nothing sent', function () { delete S.decide[id]; render(true); });
    return;
  }
  if (a === 'copy') { hud('Copy · preview only, nothing copied'); return; }
}

function boot(direction) {
  VIEW = direction;
  view = document.getElementById('view');
  hudEl = document.getElementById('hud');
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (b) { e.preventDefault(); act(b.getAttribute('data-act'), b.getAttribute('data-id'), b); }
  });
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('button, a, [data-press]');
    if (!b) return;
    b.classList.add('is-press');
    var off = function () { b.classList.remove('is-press'); window.removeEventListener('pointerup', off); window.removeEventListener('pointercancel', off); };
    window.addEventListener('pointerup', off); window.addEventListener('pointercancel', off);
  });

  render(false);
  var sp = document.getElementById('splash');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var skip = /[?&]nosplash/.test(location.search);
  if (skip) { sp.remove(); document.body.classList.add('ready'); return; }

    sp.classList.add('out'); document.body.classList.add('ready');

  }, reduce ? 700 : (direction.splashMs || 1700));
}

/* Direction 1 · Magenta Line (flight deck) */
var F1 = { filter: 'all' };
function shape1(s) {

  if (s === 'paused') return '<span class="sh sh-paused" aria-hidden="true"></span>';

function route1(big) {

  now: function () {
