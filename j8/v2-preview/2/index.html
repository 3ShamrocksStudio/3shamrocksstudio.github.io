<style>
:root{--body:#141517;--key:#1E2023;--key2:#25282C;--line:#2C2F33;--ink:#F2F2EF;--dim:#A4A7AB;--mut:#8A8E93;--white:#FFFFFF;--amb:#FFB020;--red:#FF3B30;--cash:#8BE36A;
--f:"Archivo","Rubik","Heebo",system-ui,sans-serif;--m:"Martian Mono","Rubik",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--body);color:var(--ink);font:15px/1.45 var(--f);font-variation-settings:"wdth" 100;overflow-x:hidden}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.sm{font-size:11.5px}.dim{color:var(--dim)}
/* splash: a key fades in, light pours up behind the untouched mark */
#splash{position:fixed;inset:0;z-index:99;background:var(--body);display:grid;place-items:center;transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
.sp{display:grid;justify-items:center;gap:18px}
.sp .key{width:132px;height:132px;border-radius:6px;background:var(--key);box-shadow:inset 0 1px 0 #ffffff14,inset 0 -3px 0 #00000059;position:relative;overflow:hidden;display:grid;place-items:center;opacity:0}
.sp .pour{position:absolute;inset:auto 0 0;height:0;background:linear-gradient(to top,#ffb02055,#ffffff10)}
.sp .mk{height:86px;position:relative;opacity:.25}
.sp .wm{height:24px;opacity:0}.sp p{margin:0;font:11px var(--m);color:var(--mut);opacity:0}
#splash.play .key{animation:fade .2s ease forwards}
#splash.play .pour{animation:pour .9s cubic-bezier(.4,0,.2,1) .25s forwards}
#splash.play .mk{animation:light .5s ease .55s forwards}
#splash.play .wm,#splash.play p{animation:fade .3s ease 1.05s forwards}
@keyframes fade{to{opacity:1}}@keyframes pour{to{height:100%}}@keyframes light{to{opacity:1}}
/* shell */
.app{max-width:1180px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px}
.top img{height:22px;display:block}
.top .snap{margin:0;font:10.5px/1.4 var(--m);color:var(--dim);text-align:end}.top .snap b{display:block;color:var(--white);font-weight:600}
#view.enter{animation:fade .2s ease both;opacity:0}
.lab{font:600 12px/1.2 var(--f);font-variation-settings:"wdth" 75;color:var(--mut);margin:22px 0 10px;letter-spacing:.02em}
.ttl{font:700 28px/1.1 var(--f);font-variation-settings:"wdth" 80;margin:6px 0 4px}
.sub{color:var(--dim);margin:0 0 12px}
/* hero: the hourglass key */
.hero{display:flex;gap:16px;align-items:center;background:var(--key);border-radius:6px;padding:14px;box-shadow:inset 0 1px 0 #ffffff10,inset 0 -3px 0 #0000004d}
.hk{flex:none;width:104px;height:132px;border-radius:6px;background:#17181a;position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 2px 6px #0000008c}
.hk .pour{position:absolute;inset:auto 0 0;background:var(--white);opacity:.9;animation:breathe 4s ease-in-out infinite}
.hk .pn{position:absolute;inset-inline:0;height:2px;background:var(--amb)}
.hk img{height:92px;position:relative}
.hr{min-width:0}.hr .lab{margin:0 0 4px}
.num{font-size:30px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.num span:last-child{font-size:13px;color:var(--mut)}
.cash{width:9px;height:9px;border-radius:50%;background:var(--cash);align-self:center}
.behind{margin:6px 0 2px;font-size:14px}.behind b{color:var(--amb)}
/* keys */
.kb{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 16px;border:0;border-radius:6px;background:var(--key2);color:var(--ink);font-weight:600;font-variation-settings:"wdth" 85;cursor:pointer;text-decoration:none;
box-shadow:inset 0 1px 0 #ffffff17,inset 0 -3px 0 #00000066,0 1px 0 #000;transition:background .2s ease,box-shadow .2s ease,transform .06s ease,color .2s ease}
.kb.is-press{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffffff10,inset 0 -1px 0 #00000066}
.kb.lit{background:var(--amb);color:#1a1200;box-shadow:inset 0 1px 0 #ffffff80,inset 0 -3px 0 #a0640099,0 0 18px #ffb02033}
.kb.lit-w{background:var(--white);color:#111}
.kb:disabled{opacity:.4;cursor:default}
.kb.big{width:100%;min-height:72px;justify-content:space-between;font-size:18px;padding:0 18px;text-align:start}
.kb.big.pressed{background:var(--key2);color:var(--amb);box-shadow:inset 0 0 0 1.5px var(--amb)}
.move .why{margin:10px 2px 0;color:var(--dim);font-size:14px}
.minikeys{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kb.mini{min-height:64px;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;font-size:14px;line-height:1.2;text-align:start}
/* mixer */
.mixer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#101113;border-radius:6px;padding:12px 8px;box-shadow:inset 0 2px 8px #00000080}
.ch2{display:grid;justify-items:center;gap:8px;text-decoration:none;padding:6px 2px;border-radius:6px;transition:background .2s ease,transform .06s ease;text-align:center;min-width:0}
.ch2:hover{background:#ffffff08}.ch2.is-press{transform:translateY(1px)}
.ch2 b{font-size:12px;line-height:1.15;font-variation-settings:"wdth" 70;overflow-wrap:anywhere}.ch2 small{font-size:11px;color:var(--mut);line-height:1.2}
.fader{width:10px;height:110px;background:#08090a;border-radius:5px;position:relative;box-shadow:inset 0 1px 2px #000}
.fader .fill{position:absolute;inset:auto 0 0;border-radius:5px;background:#3a3d42}
.fader .cap{position:absolute;inset-inline-start:-9px;width:28px;height:12px;margin-bottom:-6px;border-radius:3px;background:linear-gradient(#55595f,#2d3034);box-shadow:0 2px 3px #000}
.s-run .fill{background:var(--white);animation:breathe 4s ease-in-out infinite}
.s-need .fill{background:var(--amb)}.s-block .fill{background:var(--red)}.s-done .fill{background:#2a2c2f}
.mixer.big .fader{height:170px}
@keyframes breathe{0%,100%{opacity:.92}50%{opacity:.62}}
.led{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px var(--m);flex:none;background:#2a2c30;color:#55595e;box-shadow:inset 0 1px 2px #000}
.led-run{background:var(--white);box-shadow:0 0 10px #ffffff55;animation:breathe 4s ease-in-out infinite}
.led-need{background:var(--amb);box-shadow:0 0 10px #ffb02066}
.led-block{background:var(--red);color:#fff;box-shadow:0 0 8px #ff3b3055}
.led-done{background:#1b1c1e;color:#6b6f74}.led-paused{background:#2a2c30;border:2px solid var(--amb)}
.w{font:600 11px var(--m);white-space:nowrap}.w-run{color:var(--white)}.w-need,.w-paused{color:var(--amb)}.w-block{color:var(--red)}.w-done,.w-wait{color:var(--mut)}
/* lcd counters */
.lcd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.lcd div{background:#0d0e0f;border-radius:4px;padding:8px;display:grid;box-shadow:inset 0 1px 3px #000}
.lcd span{font-size:20px;color:var(--ink)}.lcd small{font-size:10.5px;color:var(--mut)}
/* stop */
.stopk{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.stopk p{margin:0 0 8px;color:var(--dim)}
.kb.long{width:100%;min-height:54px}
.stopb{background:transparent;box-shadow:inset 0 0 0 2px var(--red),inset 0 -3px 0 #00000066;color:var(--red)}
.stopb.on{background:var(--red);color:#fff}
/* lists */
.chlist,.steps,.tape,.thread{list-style:none;margin:0;padding:0}
.chlist{margin-top:12px}
.chlist a{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.chlist span:not(.led):not(.w){flex:1;min-width:0;display:grid}.chlist small,.steps small{color:var(--mut);font-size:12.5px}
.back{display:inline-block;min-height:44px;line-height:44px;text-decoration:none;color:var(--amb);font-weight:600}
.pads{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.pad{aspect-ratio:1;border-radius:6px;background:var(--key);display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff12,inset 0 -3px 0 #00000066;transition:background .2s}
.pad i{font:600 12px var(--m);font-style:normal;color:var(--mut)}
.p-done{background:#18191b}.p-done i{color:#55595e}
.p-run{background:var(--white);animation:breathe 4s ease-in-out infinite}.p-run i{color:#111}
.p-need{background:var(--amb)}.p-need i{color:#1a1200}
.p-block{background:var(--red)}.p-block i{color:#fff}
.steps li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.steps span:not(.led){display:grid}
.tape li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.tape time{color:var(--amb);font-size:11px}.tape.pr time{color:var(--white)}
.tape.big li{grid-template-columns:100px 1fr}.tape.big b{display:block;font-weight:500}.tape.big small{color:var(--mut);font-size:12px}
.tape .t-miss b{color:var(--red)}.tape .t-miss b::before{content:"! "}
.tape .t-cash b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cash);margin-inline-end:6px}
/* gate keys */
.gks{display:grid;gap:12px}
.gk{background:var(--key);border-radius:6px;padding:14px;box-shadow:inset 0 0 0 1.5px var(--amb),0 0 24px #ffb02014;transition:box-shadow .2s ease,opacity .2s ease}
.gk.off{box-shadow:inset 0 0 0 1px var(--line);opacity:.75}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gt{margin:0;font-weight:700;font-size:16px;font-variation-settings:"wdth" 85}
.ch{color:var(--amb);margin:4px 0 0}.why{margin:8px 0;color:var(--dim)}
.ev{margin:0 0 8px;padding:0;list-style:none;font:11.5px var(--m);color:var(--mut)}.ev li::before{content:"· "}
.rec{margin:0 0 10px;font-size:13px;color:var(--dim)}.rec b{color:var(--ink)}
.kbs{display:flex;gap:8px;flex-wrap:wrap}.kbs .kb{flex:1 1 80px}
.filt{margin-bottom:12px}.filt .kb{flex:0 1 auto;min-height:42px;font-size:13px}
.ul{background:none;border:0;color:var(--amb);text-decoration:underline;font:600 11px var(--m);cursor:pointer;min-height:32px}
.thread{display:grid;gap:10px;margin-bottom:14px}
.thread li{background:var(--key);border-radius:6px;padding:10px 12px;box-shadow:inset 3px 0 0 var(--white)}
.thread time{font-size:11px;color:var(--mut)}.thread p{margin:4px 0 0}
.say{display:grid;grid-template-columns:1fr auto;gap:8px}.say .lab{grid-column:1/-1;margin:0}
.say input{min-height:48px;border:0;border-radius:6px;background:#0d0e0f;color:var(--ink);padding:0 12px;font:inherit;min-width:0}
/* nav = a row of hardware keys */
#nav{position:fixed;inset:auto 0 0;z-index:20;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0f1012;border-top:1px solid var(--line)}
#nav a{flex:1;position:relative;display:grid;justify-items:center;gap:5px;padding:8px 0;min-height:56px;border-radius:6px;background:var(--key);text-decoration:none;font-size:12px;font-weight:600;font-variation-settings:"wdth" 80;color:var(--mut);box-shadow:inset 0 1px 0 #ffffff12,inset 0 -3px 0 #00000066;transition:color .2s,transform .06s}
#nav a.is-press{transform:translateY(2px)}
#nav .nl{width:18px;height:4px;border-radius:2px;background:#33363a;transition:background .2s,box-shadow .2s}
#nav a[aria-current]{color:var(--white)}#nav a[aria-current] .nl{background:var(--white);box-shadow:0 0 8px #ffffff88}
.badge{position:absolute;top:4px;inset-inline-end:8px;font:600 10px/16px var(--m);min-width:18px;padding:0 4px;border-radius:8px;background:var(--amb);color:#1a1200;font-style:normal;text-align:center}
#hud{position:fixed;z-index:60;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--ink);color:#111;border-radius:6px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:12px var(--m);opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .2s,transform .2s}
#hud.on{opacity:1;transform:none;pointer-events:auto}
#hud button{background:#111;color:var(--ink);border:0;border-radius:6px;min-height:36px;padding:0 10px;font:600 11px var(--m);cursor:pointer}
@media (min-width:960px){
  .app{padding:0 32px 40px 124px}
  #nav{inset:0 auto 0 0;width:100px;flex-direction:column;padding:84px 10px 10px;border-top:0;border-inline-end:1px solid var(--line)}
  #nav a{flex:none;min-height:68px}
  #view:has(.colL){display:grid;grid-template-columns:1fr 1fr;column-gap:24px;align-items:start}
  .colR>section:first-child .lab{margin-top:0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .gks{grid-template-columns:1fr 1fr}
  #hud{bottom:24px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

</style>
</head>

DATA.pace = Math.round(DATA.goal * DATA.elapsed / DATA.spanDays); // straight-line target for today

var STATE_WORD = { run: 'Running', need: 'Needs you', block: 'Blocked', done: 'Done', wait: 'Waiting', paused: 'Paused' };
var S = { decide: {}, stopped: false, moveStarted: false, prevMission: {} };

function esc(v) {

function ils(n) { var s = Math.abs(Math.round(n)).toLocaleString('en-US'); return (n < 0 ? '−' : '') + '₪' + s; }
function mission(id) { for (var i = 0; i < DATA.missions.length; i++) if (DATA.missions[i].id === id) return DATA.missions[i]; return null; }

}
function isPreviewState(m) { return S.stopped || !!(m.gate && S.decide[m.gate]); }
function openGates() { return DATA.gates.filter(function (g) { return !S.decide[g.id]; }); }

var VIEW = null; // set by each direction
var view, hudEl, hudTimer, lastUndo;

function hud(msg, undoFn) {
  if (!hudEl) return;
  lastUndo = undoFn || null;
  hudEl.innerHTML = '<span>' + esc(msg) + '</span>' + (undoFn ? '<button type="button" data-act="undo">Undo</button>' : '');
  hudEl.classList.remove('on'); void hudEl.offsetWidth; hudEl.classList.add('on');

}
function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) { /* no haptics */ } }

function parseHash() {
  var h = (location.hash || '').replace(/^#/, '');
  var parts = h.split('/');

}
var current = null;
function render(keepScroll) {

  var changed = !current || current.scr !== r.scr || current.id !== r.id;
  view.innerHTML = html;
  document.getElementById('nav').innerHTML = VIEW.nav(r.scr === 'mission' ? 'missions' : r.scr);

}

function act(a, id, el) {
  buzz();
  if (a === 'undo') { if (lastUndo) { var f = lastUndo; lastUndo = null; f(); hudEl.classList.remove('on'); } return; }
  if (a === 'stop') {
    S.stopped = !S.stopped;
    render(true);

    return;
  }

    return;
  }

    S.decide[id] = v;

    hud(word + ': ' + g.title + ' · preview, nothing sent', function () { delete S.decide[id]; render(true); });
    return;

}

function boot(direction) {
  VIEW = direction;
  view = document.getElementById('view');
  hudEl = document.getElementById('hud');
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');

  });

    window.addEventListener('pointerup', off); window.addEventListener('pointercancel', off);

  render(false);

}

      '<div class="hr"><h1 id="h-h" class="lab">Poured this month</h1><p class="num mono"><span class="cash" aria-hidden="true"></span>' + ils(DATA.booked) + '<span> / ' + ils(DATA.goal) + '</span></p>' +

      chips.map(function (c) { return '<button type="button" class="kb sm2' + (f === c[0] ? ' lit-w' : '') + '" data-f="' + c[0] + '" aria-pressed="' + (f === c[0]) + '">' + esc(c[1]) + '</button>'; }).join('') + '</div>' +
      '<ol class="tape big">' + DATA.proof.filter(function (p) { return f === 'all' || p.m === f; }).map(function (p) {
