<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFC462">
<title>J8NIX for Android</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--ink:#141C33;--slate:#4B5875;--fog:#D9E1F0;--mist:#F4F7FF;--white:#fff;--gold:#FFC462;--gold-d:#E9A23B;--gold-t:#6B3A00;
--band:linear-gradient(100deg,#FFD58F 0%,#FFBE55 52%,#FFB03A 100%);
--jost:'Jost',system-ui,sans-serif;--ast:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--mist);color:var(--ink);font:400 17px/1.5 var(--ast);-webkit-font-smoothing:antialiased;min-height:100vh}
.top{background:var(--band);height:8px}
main{max-width:460px;margin:0 auto;padding:40px 16px 48px}
.icon{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 20px;box-shadow:0 6px 20px rgba(20,28,51,.14)}
h1{font:500 30px/1.2 var(--jost);text-align:center;letter-spacing:.01em;margin-bottom:28px}
.dl{display:block;text-align:center;text-decoration:none;background:var(--gold);color:var(--gold-t);font:600 20px/1 var(--jost);
padding:22px 16px;border-radius:16px;border:2px solid var(--gold-d);box-shadow:0 4px 0 var(--gold-d)}
.dl:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold-d)}
.dl:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ver{text-align:center;color:var(--slate);font-size:15px;margin:14px 0 32px}
ol{background:var(--white);border:1px solid var(--fog);border-radius:16px;padding:20px 20px 20px 40px}
li{margin:6px 0;padding-left:4px}
</style>
</head>
<body>
<div class="top"></div>
<main>
<img class="icon" src="../icons/icon-192.png" alt="" width="88" height="88">
<h1>J8NIX for Android</h1>
<a class="dl" href="J8NIX-1.0.0.apk" download="J8NIX-1.0.0.apk" type="application/vnd.android.package-archive">Download</a>
<p class="ver">Version 1.0.0 · 0.2 MB</p>
<ol>
<li>Tap Download.</li>
<li>Open the file. If Android asks, allow installs from this source.</li>
<li>Open J8NIX and sign in.</li>
</ol>
</main>
</body>
</html>
