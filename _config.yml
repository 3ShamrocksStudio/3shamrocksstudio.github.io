# Serve /.well-known/assetlinks.json (Jekyll skips dot-folders by default).
include:
  - .well-known
exclude:
  - lickpick/android
  - j8-android
  - lickpick/test
  - ops/brain/BRAIN.md
  # every internal brain note (only brain.json and index.html are read by the ops pages)
  - ops/brain/*.md
  - ops/brain/brandos
  - ops/brain/grants-30d.md
  - ops/brain/milo-crisis-numbers.md
  - ops/brain/lp-golive-dryrun.md
  - work/rk-concept-v2.md
  # internal working files: keep in the repo, never publish
  - CLAUDE.md
  - README.md
  - DS-COMPLIANCE-SNAPSHOT.md
  - home-staging.html
  - preview-home.html
  - assets/audio/source
  # retired score versions (nothing loads them since sc6)
  - assets/audio/studio/v3
  # a11y scan engine source (imported by the Supabase edge function from raw GitHub)
  - a11y/engine
  - assets/audio/studio/v4
  - assets/audio/studio/v5
  # mosaic build scripts and audit (not used by the page)
  - assets/studio/mosaic/audit.py
  - assets/studio/mosaic/build.py
  - assets/studio/mosaic/library.py
  - assets/studio/mosaic/icons.js
  - assets/studio/mosaic/audit-report.json
